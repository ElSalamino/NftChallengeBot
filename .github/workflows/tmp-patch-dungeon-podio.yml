name: Patch dungeon Podio e imboscate

on:
  push:
    branches:
      - feature/dungeon-podio-imboscate
    paths:
      - ".github/workflows/tmp-patch-dungeon-podio.yml"
      - "tools/apply_dungeon_podio_patch.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dungeon-podio-imboscate

      - name: Applica patch runtime
        run: python tools/apply_dungeon_podio_patch.py

      - name: Verifica runtime
        run: |
          python -m py_compile nft.py liste.py bilanciamento.py dungeon_extra.py
          python - <<'PY'
          import random
          import liste
          import bilanciamento
          from dungeon_extra import (
              podio_probabilita_pct,
              podio_livello_premio,
              podio_penalita_gloria,
              podio_applica_penalita,
              scegli_nemici_imboscata,
          )

          assert "Podio" in liste.stanze
          assert all(x in liste.scelte for x in ("1° posto", "2° posto", "3° posto"))
          assert bilanciamento.DUNGEON_CONFIG["generale"]["imboscata"] == {"proc": 0.5, "nemici": 2}
          totale = len(liste.descri)
          assert totale > 0
          assert [podio_probabilita_pct(totale, totale, x) for x in (1,2,3)] == [1,2,3]
          assert [podio_livello_premio(x) for x in (1,2,3)] == [3,2,1]
          assert [podio_penalita_gloria(x) for x in (1,2,3)] == [10,8,6]
          assert podio_applica_penalita(4, 10) == (0, 4)
          scelti = scegli_nemici_imboscata(["a","b","c","d"], ["a","b"], 2, random.Random(3))
          assert len(scelti) == 2 and all(x not in {"a","b"} for x in scelti)
          print("Podio/imboscata runtime OK")
          PY

      - name: Salva patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py liste.py bilanciamento.py dungeon_extra.py
          git commit -m "Aggiunge Podio e imboscate ai dungeon"
          git push origin HEAD:feature/dungeon-podio-imboscate
