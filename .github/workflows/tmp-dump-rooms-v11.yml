name: Integra CI Wiki stanze v11

on:
  push:
    branches:
      - feature/wiki-stanze-v11
    paths:
      - "tools/patch_wiki_ci_v11.py"
      - ".github/workflows/tmp-dump-rooms-v11.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiki-stanze-v11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggiorna CI permanente
        run: python tools/patch_wiki_ci_v11.py
      - name: Verifica workflow e Wiki
        run: |
          python -m py_compile wiki/genera_wiki_v11.py wiki/run_wiki.py
          python wiki/run_wiki.py --output _site
          python - <<'PY'
          import json
          with open('_site/data.json',encoding='utf-8') as f: d=json.load(f)
          assert d['meta']['wiki_version']==11
          assert len(d['dungeon']['rooms'])==31
          assert all(x.get('guide') for x in d['dungeon']['rooms'])
          PY
      - name: Salva CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/wiki-pages.yml
          git commit -m "Verifica tutte le stanze nella Wiki v11"
          git push origin HEAD:feature/wiki-stanze-v11
