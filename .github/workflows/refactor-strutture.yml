name: Refactor strutture assalto

on:
  push:
    branches:
      - refactor/strutture-config

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/strutture-config
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Applica refactor
        run: python .github/refactor_strutture.py

      - name: Valida sorgenti
        run: |
          python -m py_compile nft.py turno_assalto.py bilanciamento.py liste.py frasi_set.py frasi_anelli.py frasi_incantesimi.py
          python .github/audit_frasi_set.py
          python wiki/genera_wiki.py --output /tmp/wiki-check
          test -s /tmp/wiki-check/index.html
          git diff --check

      - name: Rimuovi strumenti temporanei e salva
        run: |
          rm -f .github/refactor_strutture.py .github/workflows/refactor-strutture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralizza configurazione strutture assalto"
          git push origin HEAD:refactor/strutture-config
