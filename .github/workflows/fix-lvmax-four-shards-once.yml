name: Fix LVMAX quattro scaglioni una tantum

on:
  push:
    branches:
      - fix/lvmax-quattro-scaglioni
    paths:
      - ".github/workflows/fix-lvmax-four-shards-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lvmax-quattro-scaglioni

      - name: Richiedi tutti e quattro gli scaglioni
        run: |
          python - <<'PY'
          from pathlib import Path

          nft = Path("nft.py")
          text = nft.read_text(encoding="utf-8")
          old = 'if is_in(["Uno scaglione blu","Uno scaglione verde","Uno scaglione giallo","Uno scaglione nero"], list(player[username]["zaino"])):'
          new = '''if all(\n                        player[username]["zaino"].get(scaglione, 0) > 0\n                        for scaglione in [\n                            "Uno scaglione blu",\n                            "Uno scaglione verde",\n                            "Uno scaglione giallo",\n                            "Uno scaglione nero",\n                        ]\n                    ):'''
          if text.count(old) != 1:
              raise SystemExit(f"Condizione Fabbro attesa una volta, trovata {text.count(old)}")
          nft.write_text(text.replace(old, new, 1), encoding="utf-8")

          wiki = Path("wiki/genera_wiki_v3.py")
          text = wiki.read_text(encoding="utf-8")
          replacements = {
              "Devi possedere almeno uno dei quattro scaglioni del medaglione celeste e avere un LVX nello zaino":
                  "Devi possedere tutti e quattro gli scaglioni del medaglione celeste e avere un LVX nello zaino",
              "Lo scaglione viene controllato ma non consumato.":
                  "I quattro scaglioni vengono controllati ma non consumati.",
              "serve possedere almeno uno di questi scaglioni e incontrare il <b>Fabbro</b>":
                  "serve possedere tutti e quattro questi scaglioni e incontrare il <b>Fabbro</b>",
              "Il controllo del Fabbro non consuma lo scaglione.":
                  "Il controllo del Fabbro non consuma nessuno dei quattro scaglioni.",
          }
          for old_w, new_w in replacements.items():
              if old_w not in text:
                  raise SystemExit(f"Testo wiki non trovato: {old_w}")
              text = text.replace(old_w, new_w)
          wiki.write_text(text, encoding="utf-8")
          PY

          python -m py_compile nft.py wiki/genera_wiki_v3.py wiki/run_wiki.py wiki/validate_wiki.py
          git diff --check
          git diff -- nft.py wiki/genera_wiki_v3.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py wiki/genera_wiki_v3.py
          git commit -m "Richiede tutti e quattro gli scaglioni per LVMAX"
          git push origin HEAD:fix/lvmax-quattro-scaglioni
