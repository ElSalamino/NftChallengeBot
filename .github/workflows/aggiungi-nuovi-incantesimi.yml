name: Aggiungi nuovi incantesimi

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - .github/workflows/aggiungi-nuovi-incantesimi.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Applica nuovi incantesimi
        run: python .github/scripts/aggiungi_nuovi_incantesimi.py

      - name: Verifica sintassi
        run: python -m py_compile nft.py bilanciamento.py frasi_incantesimi.py liste.py

      - name: Verifica configurazione e descrizioni
        run: |
          python - <<'PY'
          import string
          from pathlib import Path
          import bilanciamento
          import frasi_incantesimi
          import liste

          nuovi = {
              "Cangiante": "101 pattern sociali",
              "Inevitabile": "Misture storiche e dove trovarle",
              "Spumeggiante": "The mask: Il libro",
              "Onde dell'abisso": "Le migliori location per il surf",
              "Armadillibilità": "Yoga estremo per persone comuni ma non troppo",
              "Giallo": "Il re in giallo",
              "Dominio semplice": "Cerficato della nuova ombra",
              "Caricato": "Manuale di meccanica pt 3",
          }

          effetti = {d["ef"] for d in liste.libri.values()}
          assert len(liste.libri) == 28, len(liste.libri)
          assert len(effetti) == 28, len(effetti)
          assert set(bilanciamento.INCANTESIMI_CONFIG) == effetti
          assert set(frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE) == effetti
          assert len(set(frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE.values())) == 28

          for effetto, libro in nuovi.items():
              assert liste.libri[libro]["ef"] == effetto
              assert effetto in bilanciamento.INCANTESIMI_CONFIG
              assert effetto in frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE

          formati = {"", "pct", "x", "signed", "abs", "bool", "rid_pct", "pct_mul"}
          for nome, template in frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE.items():
              for _, campo, formato, conversione in string.Formatter().parse(template):
                  if campo is None:
                      continue
                  assert conversione is None
                  assert formato in formati, (nome, formato)
                  valore = bilanciamento.INCANTESIMI_CONFIG[nome]
                  for parte in campo.split("."):
                      assert isinstance(valore, dict) and parte in valore, (nome, campo, parte)
                      valore = valore[parte]

          # I nuovi libri entrano solo nei pool arena che già distribuivano libri.
          for pool in liste.arenamod.values():
              if "Libro del bene e del male" in pool:
                  for libro in nuovi.values():
                      assert libro in pool, libro

          nft = Path("nft.py").read_text(encoding="utf-8")
          assert '"Cangiante" in main.get("incantamenti", [])' in nft
          assert '"Dominio semplice" in oppo.get("incantamenti", [])' in nft
          assert '"Caricato" in main.get("incantamenti", [])' in nft
          assert '"Onde dell\'abisso" in player.get("incantamenti", [])' in nft
          assert '"Armadillibilità" in player.get("incantamenti", [])' in nft
          assert '"Giallo" in giocatore.get("incantamenti", [])' in nft
          assert 'matx_effettivo' in nft
          assert 'giocatore["incantamenti"] = get_ench(player[username])' in nft

          turno = nft.split("def turno(main, oppo,cond=None):", 1)[1].split("async def dungeon_stanze", 1)[0]
          letture_main_set = [r for r in turno.splitlines() if 'main["set"]' in r]
          letture_oppo_set = [r for r in turno.splitlines() if 'oppo["set"]' in r]
          print("Occorrenze main[set] nel turno:", letture_main_set)
          print("Occorrenze oppo[set] nel turno:", letture_oppo_set)
          print("OK: 28/28 incantesimi, 8 nuovi validati")
          PY

      - name: Commit finale
        run: |
          git restore __pycache__ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py bilanciamento.py frasi_incantesimi.py liste.py
          git rm -f .github/workflows/aggiungi-nuovi-incantesimi.yml .github/scripts/aggiungi_nuovi_incantesimi.py
          git commit -m "feat: aggiungi otto nuovi incantesimi"
          git push origin refactor/bilanciamento-config
