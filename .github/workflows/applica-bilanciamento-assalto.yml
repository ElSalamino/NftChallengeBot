name: Applica bilanciamento assalto

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - .github/workflows/applica-bilanciamento-assalto.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Applica patch
        run: python patch_assalto_tmp.py

      - name: Valida
        run: |
          python -m py_compile nft.py bilanciamento.py frasi_set.py frasi_anelli.py frasi_incantesimi.py
          python - <<'PY'
          from bilanciamento import PROC_CLASSI

          attesi = {
              ('Lanciatore olimpico', 'tridente', 'proc'): 80,
              ('Manipolatore di morte', 'distrazione', 'proc'): 100,
              ('Cacciatore della feccia', 'massa_nemici', 'proc'): 100,
              ('Serial killer', 'bersaglio_enorme', 'agi'): 130,
              ('Cercatore di reliquie', 'cannoncino', 'proc'): 100,
              ('Arciere di prima linea', 'fabbro', 'proc'): 100,
              ('Uomo di classe', 'spumeggiante', 'proc'): 50,
              ('Maestro delle tartarughe', 'carapace', 'proc'): 50,
              ('Difensore delle mareggiate', 'fauna', 'proc'): 50,
              ('Uomo di un tempo', 'vitalita', 'hp'): 55,
              ('Chierico', 'cura', 'proc'): 100,
              ('Chierico', 'cura', 'cura'): 150,
              ('Medico improvvisato', 'cura', 'proc'): 100,
              ('Medico improvvisato', 'cura', 'cura'): 500,
              ('Guaritore da campo', 'cura', 'proc'): 100,
              ('Guaritore da campo', 'cura', 'cura'): 70,
              ('Druido della selva', 'natura', 'proc'): 80,
              ('Cacciatore di bestie', 'previsione', 'proc'): 100,
              ('Vampiro', 'pipistrello', 'proc'): 100,
              ('Ricercatore del pericolo', 'adrenalina', 'proc'): 100,
              ('Abitante', 'alberelli', 'proc'): 100,
              ('Illusionista', 'copie', 'proc'): 50,
              ('Ultima speranza', 'paura', 'proc'): 50,
              ('Ultima speranza', 'paura', 'bonus_def_nemico'): -150,
              ('Sanguinolento', 'sangue', 'proc'): 80,
          }
          for (nome, effetto, chiave), valore in attesi.items():
              trovato = PROC_CLASSI[nome]['assalto'][effetto][chiave]
              assert trovato == valore, (nome, effetto, chiave, trovato, valore)

          cfg = PROC_CLASSI['Lanciatore olimpico']['assalto']['tridente']
          assert cfg['danno'] == 80 and cfg['decremento'] == 10 and cfg['hp_min'] == 80

          src = open('nft.py', encoding='utf-8').read()
          assert 'danno_tridente -= cfg_tridente["decremento"]' in src
          assert 'if clan[team].get("membri"):' in src
          assert "if anello != None:\n        for pl in clan[team]['membri']:" not in src
          print('Validazione assalto OK')
          PY

      - name: Commit e pulizia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f patch_assalto_tmp.py .github/workflows/applica-bilanciamento-assalto.yml
          git add bilanciamento.py nft.py frasi_set.py
          git commit -m "feat: aggiorna bilanciamento assalto"
          git push origin refactor/bilanciamento-config
