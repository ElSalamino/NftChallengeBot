name: Correggi descrizione Uomo di classe

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Correggi frase e valida
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frasi_set.py')
          text = path.read_text(encoding='utf-8')
          old = '"Uomo di classe": "Lo scontro diventa spumeggiante: in attacco succede nell\'85% dei casi e in difesa nel 88%. In assalto hai il 35% di togliere 40 agilità alla difesa nemica.",'
          new = '"Uomo di classe": "Quando parte Spumeggiante copi la statistica dell\'avversario per quel calcolo: in attacco hai il {turno.spumeggiante_attacco.proc:pct} di usare il suo attacco al posto del tuo, mentre in difesa hai il {turno.spumeggiante_difesa.proc:pct} di usare la sua difesa al posto della tua. In assalto hai il {assalto.spumeggiante.proc:pct} di usare attacco e difesa della struttura nemica, riducendone anche l\'agilità di {assalto.spumeggiante.agi_difesa:abs}.",'
          if old not in text:
              raise RuntimeError('Frase Uomo di classe non trovata')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          nft = Path('nft.py').read_text(encoding='utf-8')
          assert 'dps = oppo["atk"]' in nft
          assert 'difesan = main["def"]' in nft
          assert 'dps = attaccon' in nft
          assert 'defense = difesan' in nft
          PY
          python -m py_compile nft.py bilanciamento.py frasi_set.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/correggi-uomo-di-classe.yml
          git add frasi_set.py
          git commit -m "fix: descrivi correttamente Uomo di classe"
          git push origin HEAD:refactor/bilanciamento-config
