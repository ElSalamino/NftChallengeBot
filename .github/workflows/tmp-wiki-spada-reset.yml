name: Corregge Wiki Spada conficcata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-wiki-spada-reset.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corregge descrizione
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wiki/genera_wiki_v11.py')
          s = p.read_text(encoding='utf-8')
          old = '"rewards":["Dono stellare LV4"],"risks":["La build corrente viene completamente liberata e le statistiche permanenti tornano alla base, con gli extra restituiti come oggetti-punto"]}'
          new = '"rewards":["Dono stellare LV4"],"risks":[]}'
          if s.count(old) != 1:
              raise SystemExit(f'Match inatteso: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile wiki/genera_wiki_v11.py
          python wiki/run_wiki.py --output _site
          grep -q 'Dono stellare' _site/data.json
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/genera_wiki_v11.py
          git diff --cached --quiet || git commit -m "Chiarisce il reset della Spada conficcata"
          git push origin HEAD:main
