name: Scan set mancanti

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  scan:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0
      - name: Estrai occorrenze
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              'Eroe caduto', 'Eroe della rivolta', 'Paladino', 'Serial killer',
              'Difensore del popolo', 'Spadaccino Musashi', 'Incubo dei cieli',
              'Pescatore', 'Esperto di animali'
          ]
          lines = Path('nft.py').read_text(encoding='utf-8').splitlines()
          out = []
          for target in targets:
              out.append('\n' + '='*90)
              out.append(target)
              out.append('='*90)
              hits = [i for i, line in enumerate(lines) if target in line]
              if not hits:
                  out.append('NESSUNA OCCORRENZA')
                  continue
              used = set()
              for i in hits:
                  start = max(0, i-10)
                  end = min(len(lines), i+18)
                  if any(abs(i-j) < 10 for j in used):
                      continue
                  used.add(i)
                  out.append(f'--- contesto riga {i+1} ---')
                  for n in range(start, end):
                      out.append(f'{n+1:05d}: {lines[n]}')
          Path('set_mancanti_scan.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit report e rimuovi workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add set_mancanti_scan.txt
          git rm .github/workflows/scan-set-mancanti.yml
          git commit -m "chore: analizza set mancanti"
          git push origin HEAD:refactor/bilanciamento-config
