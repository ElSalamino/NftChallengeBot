name: Finalizza frasi tecniche set

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Rendi custom anche i set senza proc
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pprint
          from pathlib import Path

          path = Path('frasi_set.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          node = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'FRASI_SET_TECNICHE' for t in n.targets))
          frasi = ast.literal_eval(node.value)

          frasi.update({
              'Piccolo kraken': 'Non ha proc numerici aggiuntivi nel database: il profilo base è HP {bonus.hp:signed}, ATK {bonus.atk:signed}, DEF {bonus.def:signed}, AGI {bonus.agi:signed}.',
              'Operatore di classe': 'Nessun proc aggiuntivo: il set lavora sui bonus base, con ATK {bonus.atk:signed} e DEF {bonus.def:signed} (HP {bonus.hp:signed}, AGI {bonus.agi:signed}).',
              'Combattente diretto': 'È un set puramente statistico: HP {bonus.hp:signed}, ATK {bonus.atk:signed}, DEF {bonus.def:signed} e AGI {bonus.agi:signed}, senza proc aggiuntivi.',
              'Cavaliere del passaggio': 'Difende il passaggio solo con statistiche certe: ATK {bonus.atk:signed} e DEF {bonus.def:signed}, senza proc numerici aggiuntivi.',
              'Taglialegna schivo': 'La sua forza è tutta nel profilo base: DEF {bonus.def:signed} e AGI {bonus.agi:signed}; non ha proc numerici aggiuntivi.',
              'Cultista oscuro': 'Nessun proc: il culto converte tutto in pressione offensiva con ATK base {bonus.atk:signed}.',
              'Dolce mietitore': 'Nessun proc: il set investe tutto nella resistenza con DEF base {bonus.def:signed}.',
              'Pyromante': 'Nessun proc aggiuntivo: il fuoco è già nel bonus base, con ATK {bonus.atk:signed}.',
              'Armaliere': 'È un set senza proc: ATK {bonus.atk:signed} e DEF {bonus.def:signed} sono applicati direttamente come bonus base.',
              "Controllore del'entrata": 'Nessun proc: il set punta su HP {bonus.hp:signed} e AGI {bonus.agi:signed}, con ATK {bonus.atk:signed} e DEF {bonus.def:signed}.',
              'Selvaggio': 'Il database non registra proc numerici extra: bonus base HP {bonus.hp:signed}, ATK {bonus.atk:signed}, DEF {bonus.def:signed}, AGI {bonus.agi:signed}; le interazioni con gli approcci restano nel comportamento base.',
              'Combattente della taverna': 'Nessun proc: porta direttamente ATK {bonus.atk:signed} e DEF {bonus.def:signed} come bonus base.',
              'Medievalista': 'Nessun proc: il set concede DEF {bonus.def:signed} e AGI {bonus.agi:signed} direttamente.',
              'Spaccatesta': 'È un set di statistiche pure: ATK {bonus.atk:signed} e DEF {bonus.def:signed}, senza proc numerici aggiuntivi.',
              'Piarata': 'Nessun proc: il profilo base concede ATK {bonus.atk:signed}, DEF {bonus.def:signed} e AGI {bonus.agi:signed}.',
              'Teppistello duro': 'Nessun proc: il set concentra tutto in DEF base {bonus.def:signed}.',
              'Apprendista delle paludi': 'Nessun proc numerico: il set vive del suo grande bonus base, HP {bonus.hp:signed}.',
              'Incubo dei cieli': 'Non ha proc numerici centralizzati: il profilo aggressivo dà ATK {bonus.atk:signed} e DEF {bonus.def:signed}.',
          })

          lines = text.splitlines(keepends=True)
          replacement = 'FRASI_SET_TECNICHE = ' + pprint.pformat(frasi, width=170, sort_dicts=False) + '\n'
          text = ''.join(lines[:node.lineno-1]) + replacement + ''.join(lines[node.end_lineno:])
          path.write_text(text, encoding='utf-8')
          PY

      - name: Collega renderer a nft.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nft.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from bilanciamento import PROC_CLASSI, PROC_ANELLI, DUNGEON_CONFIG\n'
          if 'from frasi_set import FRASI_SET_TECNICHE\n' not in text:
              text = text.replace(old_import, old_import + 'from frasi_set import FRASI_SET_TECNICHE\n', 1)

          marker = 'def descrizione_set_tecnica(nome, bonus=None):\n'
          renderer = '''def _numero_placeholder_tecnico(valore):
              if isinstance(valore, float) and valore.is_integer():
                  return str(int(valore))
              if isinstance(valore, float):
                  return f"{valore:g}"
              return str(valore)


          def _valore_placeholder_set(nome, bonus, percorso):
              parti = percorso.split(".")
              if parti[0] == "bonus":
                  valore = bonus or {}
                  parti = parti[1:]
              else:
                  valore = PROC_CLASSI.get(nome, {})
              for parte in parti:
                  if not isinstance(valore, dict) or parte not in valore:
                      raise KeyError(f"Placeholder set non valido: {nome}.{percorso}")
                  valore = valore[parte]
              return valore


          def _format_placeholder_set(valore, formato=""):
              if formato == "pct":
                  return f"{_numero_placeholder_tecnico(valore)}%"
              if formato == "x":
                  return f"{_numero_placeholder_tecnico(valore)}x"
              if formato == "signed":
                  if isinstance(valore, (int, float)) and not isinstance(valore, bool) and valore > 0:
                      return "+" + _numero_placeholder_tecnico(valore)
                  return _numero_placeholder_tecnico(valore)
              if formato == "abs":
                  return _numero_placeholder_tecnico(abs(valore))
              if formato == "bool":
                  return "sì" if valore else "no"
              if formato == "rid_pct":
                  return f"{_numero_placeholder_tecnico((1 - float(valore)) * 100)}%"
              if formato:
                  raise ValueError(f"Formato placeholder non supportato: {formato}")
              return _numero_placeholder_tecnico(valore)


          def render_frase_set_tecnica(nome, bonus=None):
              template = FRASI_SET_TECNICHE.get(nome, "")
              if not template:
                  return ""
              parti = []
              for letterale, campo, formato, conversione in string.Formatter().parse(template):
                  parti.append(letterale)
                  if campo is None:
                      continue
                  if conversione:
                      raise ValueError(f"Conversione placeholder non supportata: {conversione}")
                  valore = _valore_placeholder_set(nome, bonus or {}, campo)
                  parti.append(_format_placeholder_set(valore, formato))
              return "".join(parti)


          '''
          if 'def render_frase_set_tecnica(' not in text:
              text = text.replace(marker, renderer + marker, 1)

          old = '''def descrizione_set_tecnica(nome, bonus=None):
              """Descrizione meccanica del set, generata direttamente da PROC_CLASSI."""
              righe = ["⚙️ Dettagli tecnici"]
              bonus = bonus or {}
              bonus_testo = []
          '''
          new = '''def descrizione_set_tecnica(nome, bonus=None):
              """Descrizione meccanica del set, con frase custom e dati analitici."""
              righe = ["⚙️ Dettagli tecnici"]
              bonus = bonus or {}
              frase_custom = render_frase_set_tecnica(nome, bonus)
              if frase_custom:
                  righe.append("📝 " + frase_custom)
              bonus_testo = []
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'frase_custom = render_frase_set_tecnica(nome, bonus)' not in text:
              raise RuntimeError('Impossibile aggiornare descrizione_set_tecnica')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Valida tutti i set e i placeholder
        shell: bash
        run: |
          python - <<'PY'
          import ast, string
          from pathlib import Path

          def lit(path, name):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              for n in tree.body:
                  if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in n.targets):
                      return ast.literal_eval(n.value)
              raise RuntimeError(name)

          classi = lit('liste.py', 'classi')
          bonus = lit('liste.py', 'bonus')
          proc = lit('bilanciamento.py', 'PROC_CLASSI')
          frasi = lit('frasi_set.py', 'FRASI_SET_TECNICHE')
          assert len(classi) == len(proc) == len(frasi) == 114
          assert set(classi) == set(proc) == set(frasi)
          assert len(set(frasi.values())) == 114, 'Ogni set deve avere una frase diversa'

          valid_formats = {'', 'pct', 'x', 'signed', 'abs', 'bool', 'rid_pct'}
          for nome, template in frasi.items():
              assert template.strip(), nome
              for _, field, fmt, conv in string.Formatter().parse(template):
                  if field is None:
                      continue
                  assert not conv, f'{nome}: conversione non valida {conv}'
                  assert fmt in valid_formats, f'{nome}: formato non valido {fmt}'
                  parts = field.split('.')
                  value = bonus.get(nome, {}) if parts[0] == 'bonus' else proc[nome]
                  if parts[0] == 'bonus':
                      parts = parts[1:]
                  for part in parts:
                      assert isinstance(value, dict) and part in value, f'{nome}: placeholder non valido {field}'
                      value = value[part]
                  if fmt in {'pct', 'x', 'signed', 'abs', 'rid_pct'}:
                      assert isinstance(value, (int, float)), f'{nome}: {field}:{fmt} non numerico'

          print('OK: 114/114 set, 114 frasi distinte, tutti i placeholder risolti')
          PY
          python -m py_compile nft.py bilanciamento.py frasi_set.py

      - name: Commit finale
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f snapshot_frasi_set.txt report_frasi_set_compact.txt
          git rm --ignore-unmatch .github/workflows/integra-frasi-set.yml
          git rm --ignore-unmatch .github/workflows/finalizza-frasi-set.yml
          git add -A
          git commit -m "feat: aggiungi frasi tecniche custom per tutti i set"
          git push origin HEAD:refactor/bilanciamento-config
