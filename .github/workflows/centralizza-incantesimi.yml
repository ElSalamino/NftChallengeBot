name: Centralizza incantesimi

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - .github/workflows/centralizza-incantesimi.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Rendi robusto il matcher Necron
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/centralizza_incantesimi.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('# Necron: ripristina')
          end = s.index('\nnft_path.write_text', start)
          replacement = '''# Necron: ripristina l'effetto storico corretto, 1000 HP.\nnecron_start = nft.find('elif necron and player["hp"] <= 0:')\nif necron_start < 0:\n    raise SystemExit("ramo Necron non trovato")\nold_necron_hp = 'player["hp"] = proc_val(set, "assalto", "resurrezione", "hp")'\nnecron_hp = nft.find(old_necron_hp, necron_start)\nnext_branch = nft.find('\\n    elif ', necron_start + 1)\nif necron_hp < 0 or (next_branch >= 0 and necron_hp > next_branch):\n    raise SystemExit("assegnazione HP Necron non trovata nel ramo corretto")\nnft = nft[:necron_hp] + 'player["hp"] = 1000' + nft[necron_hp + len(old_necron_hp):]\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Applica trasformazione
        run: python .github/scripts/centralizza_incantesimi.py

      - name: Verifica sintassi
        run: python -m py_compile nft.py bilanciamento.py frasi_incantesimi.py

      - name: Verifica copertura e fix
        run: |
          python - <<'PY'
          import string
          import bilanciamento
          import frasi_incantesimi
          import liste
          from pathlib import Path

          effetti = {dati["ef"] for dati in liste.libri.values()}
          config = bilanciamento.INCANTESIMI_CONFIG
          frasi = frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE

          assert len(liste.libri) == 20
          assert len(effetti) == 20
          assert set(config) == effetti
          assert set(frasi) == effetti
          assert len(set(frasi.values())) == 20

          formati = {"", "pct", "x", "signed", "abs", "bool", "rid_pct", "pct_mul"}
          for nome, template in frasi.items():
              for _, campo, formato, conversione in string.Formatter().parse(template):
                  if campo is None:
                      continue
                  assert conversione is None
                  assert formato in formati
                  valore = config[nome]
                  for parte in campo.split("."):
                      assert isinstance(valore, dict) and parte in valore, (nome, campo, parte)
                      valore = valore[parte]

          nft = Path("nft.py").read_text(encoding="utf-8")
          init = Path("__init__.py").read_text(encoding="utf-8")
          bil = Path("bilanciamento.py").read_text(encoding="utf-8")

          blocco = nft.split('elif necron and player["hp"] <= 0:', 1)[1].split('elif ', 1)[0]
          assert 'player["hp"] = 1000' in blocco
          assert 'proc_val(set, "assalto", "resurrezione", "hp")' not in blocco

          assert 'bonus_fortunello = nft.effetto_val("Fortunello", "sfida", "premio_oggetto", "bonus_probabilita_per_livello_pct") / 100' in init
          assert 'possibilib += bonus_fortunello * b["scheda"]["boost"]["sfida"]["Fortunello"].get("lv", 0)' in init
          assert 'possibilib += 0.05 * a["scheda"]["boost"]["sfida"]["Fortunello"]["lv"]' not in init
          assert bilanciamento.EFFETTI_CONFIG["Fortunello"]["sfida"]["premio_oggetto"]["bonus_probabilita_per_livello_pct"] == 5

          assert "smateriabile_proc" not in nft
          assert "smateriabile_proc" not in bil
          assert "INCANTESIMI_CONFIG" in nft
          assert "FRASI_INCANTESIMI_TECNICHE" in nft
          assert "⚙️ Dettagli dell'incantesimo" in nft

          print("OK: 20/20 incantesimi, Necron e Fortunello validati")
          PY

      - name: Commit finale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py bilanciamento.py frasi_incantesimi.py __init__.py
          git rm .github/workflows/centralizza-incantesimi.yml .github/scripts/centralizza_incantesimi.py
          git commit -m "feat: centralizza incantesimi e correggi effetti"
          git push origin refactor/bilanciamento-config
