name: Apply seconda ondata set

on:
  push:
    branches:
      - "feature/set-eroi-tempesta"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0
      - name: Apply
        run: python apply_seconda_ondata.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile liste.py bilanciamento.py frasi_set.py nft.py
          python - <<'PY'
          import liste, bilanciamento, frasi_set
          from pathlib import Path
          wanted = {
              "Anima persa": ["Bastone del folle", "Anima dispersa"],
              "Disabilitatore provetto": ["Cacciavite multiuso", "Delle squame viscide"],
              "Controllore del cielo": ["Artiglio di Drago", "Ali piumate"],
              "Eterna sventura": ["Guanti di cormorant", "Corona maledetta"],
              "Pescatore alternativo": ["Ascia bipenne", "Cappellino da pescatore"],
              "Esca vivente": ["Canna blu", "Armatura di carne"],
              "Giustiziere a V": ["Frusta telaia", "Armatura del folle"],
          }
          weapons = set(liste.armi) | set(liste.armiextra)
          protections = set(liste.protezioni) | set(liste.protezioniextra)
          for name, pair in wanted.items():
              assert liste.classi[name] == pair
              assert pair[0] in weapons, (name, pair[0])
              assert pair[1] in protections, (name, pair[1])
              assert name in liste.Approccini and name in liste.bonus and name in liste.frasi_set
              assert name in bilanciamento.PROC_CLASSI and name in frasi_set.FRASI_SET_TECNICHE
          src = Path("nft.py").read_text(encoding="utf-8")
          for token in [
              "_tiro_schivata_seconda_ondata(possibile, oppo)",
              'main.get("set") == "Pescatore alternativo"',
              'combattente.get("set") == "Controllore del cielo"',
              'main.get("set") == "Eterna sventura"',
              'nome_set == "Disabilitatore provetto" and target == "Muraglione extra"',
              'nome_set == "Giustiziere a V" and target == "Accampamento"',
              'nome_set == "Esca vivente"',
          ]:
              assert token in src, token
          print("Validazione seconda ondata OK")
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          rm -f apply_seconda_ondata.py .github/workflows/apply_seconda_ondata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Aggiunge sette nuovi set"
          git push origin feature/set-eroi-tempesta
