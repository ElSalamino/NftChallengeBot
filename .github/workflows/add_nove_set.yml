name: Add nine sets

on:
  push:
    branches:
      - feature/set-eroi-tempesta
    paths:
      - .github/workflows/add_nove_set.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python .github/apply_nove_set.py

      - name: Validate
        shell: bash
        run: |
          python -m py_compile liste.py bilanciamento.py frasi_set.py nft.py
          python - <<'PY'
          import liste
          from bilanciamento import PROC_CLASSI
          from frasi_set import FRASI_SET_TECNICHE

          attesi = {
              "Monarca oscuro": ("Palla Ombra", "Scudo d'ossidiana"),
              "Oscurato": ("NotteSferza", "Teschio d'ossidiana"),
              "Demone delle lame": ("Coltelli da lancio", "Un machete"),
              "Re dei gadget": ("Bomba sneaky", "Bastone sferico"),
              "Il comico": ("Bomba sneaky", "Sgabello da bar"),
              "Survival medievale": ("Spada della vitalità", "Un armatura in filo spinato"),
              "Duellista vermico": ("Spada d'oro fortissima", "Secchiello di vermi"),
              "Cacciatore d'esce": ("Coltelli da lancio", "Armatura di esche"),
              "Duro a morire": ("Stecca di ferro", "Un tavolo speziato"),
          }
          armi = {x.split(" LV")[0] for x in liste.armi}
          protezioni = {x.split(" LV")[0] for x in liste.protezioni}
          for nome, (arma, protezione) in attesi.items():
              assert liste.classi[nome] == [arma, protezione], (nome, liste.classi[nome])
              assert arma in armi, (nome, arma)
              assert protezione in protezioni, (nome, protezione)
              assert nome in liste.Approccini
              assert nome in liste.bonus
              assert nome in liste.frasi_set
              assert nome in PROC_CLASSI
              assert nome in FRASI_SET_TECNICHE

          assert liste.bonus["Survival medievale"] == {"hp": 500, "def": 0, "atk": 0, "agi": 0}
          assert liste.bonus["Duro a morire"] == {"hp": 0, "def": 222, "atk": 0, "agi": 0}
          assert PROC_CLASSI["Monarca oscuro"]["combattimento"]["inizio"]["hp_target_percento"] == 60
          assert PROC_CLASSI["Oscurato"]["combattimento"]["riflesso"]["percento"] == 5
          assert PROC_CLASSI["Demone delle lame"]["combattimento"]["danno_extra"]["percento"] == 20
          assert PROC_CLASSI["Demone delle lame"]["assalto"]["danno_extra"]["percento"] == 30
          assert PROC_CLASSI["Il comico"]["combattimento"]["confusione"]["proc"] == 15
          assert PROC_CLASSI["Duellista vermico"]["combattimento"]["vermi"]["proc"] == 11
          assert PROC_CLASSI["Cacciatore d'esce"]["combattimento"]["secondo_colpo"] == {"proc": 40, "percento_danno": 50}

          nft = open("nft.py", encoding="utf-8").read()
          assert "_turno_terza_ondata_base = turno" in nft
          assert "_assedio_terza_ondata_base = assedio" in nft
          assert nft.count('set == "Oscurato" and difesa in nemico') >= 2
          print("Validazione nove set OK")
          PY
          git diff --check

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge nove nuovi set"
          git push origin HEAD:feature/set-eroi-tempesta
