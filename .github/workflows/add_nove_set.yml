name: Add nine sets

on:
  push:
    branches:
      - feature/set-eroi-tempesta
    paths:
      - .github/workflows/add_nove_set.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch set catalog, balance, descriptions and runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          MARKER = "# --- TERZA ONDATA SET: NOVE SET ---"

          # liste.py
          p = Path("liste.py")
          text = p.read_text(encoding="utf-8")
          if MARKER not in text:
              text += r'''

# --- TERZA ONDATA SET: NOVE SET ---
classi.update({
    "Monarca oscuro": ["Palla Ombra", "Scudo d'ossidiana"],
    "Oscurato": ["NotteSferza", "Teschio d'ossidiana"],
    "Demone delle lame": ["Coltelli da lancio", "Un machete"],
    "Re dei gadget": ["Bomba sneaky", "Bastone sferico"],
    "Il comico": ["Bomba sneaky", "Sgabello da bar"],
    "Survival medievale": ["Spada della vitalità", "Un armatura in filo spinato"],
    "Duellista vermico": ["Spada d'oro fortissima", "Secchiello di vermi"],
    "Cacciatore d'esce": ["Coltelli da lancio", "Armatura di esche"],
    "Duro a morire": ["Stecca di ferro", "Un tavolo speziato"],
})

Approccini.update({
    "Monarca oscuro": ["Malevolo", "Vendicativo", "Difensivo"],
    "Oscurato": ["Vendicativo", "Difensivo", "Conservativo"],
    "Demone delle lame": ["Aggressivo", "Spinto", "Agile"],
    "Re dei gadget": ["Autorevole", "Conservativo", "Agile"],
    "Il comico": ["Spavaldo", "Rischioso", "Agile"],
    "Survival medievale": ["Conservativo", "Impavido", "Difensivo"],
    "Duellista vermico": ["Spavaldo", "Aggressivo", "Rischioso"],
    "Cacciatore d'esce": ["Aggressivo", "Agile", "Spinto"],
    "Duro a morire": ["Difensivo", "Conservativo", "Impavido"],
})

bonus.update({
    "Monarca oscuro": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Oscurato": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Demone delle lame": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Re dei gadget": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Il comico": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Survival medievale": {"hp": 500, "def": 0, "atk": 0, "agi": 0},
    "Duellista vermico": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Cacciatore d'esce": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
    "Duro a morire": {"hp": 0, "def": 222, "atk": 0, "agi": 0},
})

frasi_set.update({
    "Monarca oscuro": "La battaglia comincia già nella penombra: il nemico entra debilitato e in assalto l'ombra di chi ti ha preceduto si abbatte sul bersaglio.",
    "Oscurato": "Il dolore non resta mai da una parte sola: una parte di ogni ferita torna sempre indietro.",
    "Demone delle lame": "Ogni lama trova un secondo varco: i tuoi colpi mordono più a fondo in ogni combattimento.",
    "Re dei gadget": "Non serve capire come funzioni: basta avere abbastanza gadget da sembrare improvvisamente molto più intelligente.",
    "Il comico": "Un sonoro CLAP e la concentrazione sparisce: l'avversario può diventare il proprio peggior nemico.",
    "Survival medievale": "Vecchia scuola, molta vita: sopravvivere è più semplice quando parti con parecchia carne in più.",
    "Duellista vermico": "Il primo verme è inevitabile. Se il gusto prende piede, potresti non smettere più di mangiarne.",
    "Cacciatore d'esce": "Ogni colpo può richiamarne un secondo, meno potente ma abbastanza fastidioso da fare la differenza.",
    "Duro a morire": "Non elegante, non veloce, semplicemente molto difficile da buttare giù.",
})
'''
              p.write_text(text, encoding="utf-8")

          # bilanciamento.py
          p = Path("bilanciamento.py")
          text = p.read_text(encoding="utf-8")
          if MARKER not in text:
              text += r'''

# --- TERZA ONDATA SET: NOVE SET ---
PROC_CLASSI.update({
    "Monarca oscuro": {
        "combattimento": {"inizio": {"hp_target_percento": 60}},
        "assalto": {"last": {"danno_per_last": 10, "finestra_secondi": 301}},
    },
    "Oscurato": {
        "combattimento": {"riflesso": {"percento": 5}},
        "assalto": {"riflesso": {"percento": 5}},
    },
    "Demone delle lame": {
        "combattimento": {"danno_extra": {"percento": 20}},
        "assalto": {"danno_extra": {"percento": 30}},
    },
    "Re dei gadget": {
        "combattimento": {"intelletto": {"int": 200}},
    },
    "Il comico": {
        "combattimento": {"confusione": {"proc": 15}},
        "assalto": {"clap": {"solo_testo": True}},
    },
    "Survival medievale": {
        "generale": {"set_base": {"solo_bonus_base": True}},
    },
    "Duellista vermico": {
        "combattimento": {"vermi": {"proc": 11, "primo_garantito": True, "atk": 1, "def": 1, "hp": 20}},
        "assalto": {"vermi": {"proc": 11, "primo_garantito": True, "atk": 1, "def": 1, "hp": 20}},
    },
    "Cacciatore d'esce": {
        "combattimento": {"secondo_colpo": {"proc": 40, "percento_danno": 50}},
        "assalto": {"secondo_colpo": {"proc": 40, "percento_danno": 50}},
    },
    "Duro a morire": {
        "generale": {"set_base": {"solo_bonus_base": True}},
    },
})
'''
              p.write_text(text, encoding="utf-8")

          # frasi_set.py
          p = Path("frasi_set.py")
          text = p.read_text(encoding="utf-8")
          if MARKER not in text:
              text += r'''

# --- TERZA ONDATA SET: NOVE SET ---
FRASI_SET_TECNICHE.update({
    "Monarca oscuro": "COMBATTIMENTO (vale anche in dungeon e boss): l'avversario inizia al {combattimento.inizio.hp_target_percento:pct} dei suoi HP. ASSALTO: all'inizio infliggi {assalto.last.danno_per_last} danni per ogni entry last attiva negli ultimi {assalto.last.finestra_secondi} secondi alla struttura scelta.",
    "Oscurato": "COMBATTIMENTO (vale anche in dungeon e boss): ogni danno subito ne riflette il {combattimento.riflesso.percento:pct} all'avversario. ASSALTO: ogni colpo delle difese subito riflette il {assalto.riflesso.percento:pct} alla struttura che lo ha inflitto.",
    "Demone delle lame": "COMBATTIMENTO (vale anche in dungeon e boss): ogni colpo andato a segno infligge il {combattimento.danno_extra.percento:pct} di danno extra. ASSALTO: il colpo alla struttura bersaglio infligge il {assalto.danno_extra.percento:pct} di danno extra.",
    "Re dei gadget": "COMBATTIMENTO (vale anche in dungeon e boss): all'inizio ottieni {combattimento.intelletto.int:signed} INT fino alla fine dello scontro.",
    "Il comico": "COMBATTIMENTO (vale anche in dungeon e boss): all'inizio compare un sonoro CLAP! A ogni turno l'avversario ha il {combattimento.confusione.proc:pct} di provare a colpirsi da solo; se non schiva, subisce il proprio colpo. ASSALTO: compare CLAP!, senza altri effetti.",
    "Survival medievale": "Bonus base sempre attivo in qualunque modalità: {bonus.hp:signed} HP.",
    "Duellista vermico": "COMBATTIMENTO e ASSALTO: il primo verme è garantito; poi hai il {combattimento.vermi.proc:pct} di mangiarne un altro, ripetendo finché fallisci. Ogni verme dà {combattimento.vermi.atk:signed} ATK, {combattimento.vermi.def:signed} DEF e {combattimento.vermi.hp:signed} HP.",
    "Cacciatore d'esce": "COMBATTIMENTO (vale anche in dungeon e boss): ogni colpo andato a segno ha il {combattimento.secondo_colpo.proc:pct} di generare un secondo colpo pari al {combattimento.secondo_colpo.percento_danno:pct} del primo. ASSALTO: stessa logica con {assalto.secondo_colpo.proc:pct} di probabilità e {assalto.secondo_colpo.percento_danno:pct} della forza del primo colpo.",
    "Duro a morire": "Bonus base sempre attivo in qualunque modalità: {bonus.def:signed} DEF.",
})
'''
              p.write_text(text, encoding="utf-8")

          # nft.py: riflesso Oscurato dentro il vero danno delle strutture + wrapper globale combattimento/assalto.
          p = Path("nft.py")
          text = p.read_text(encoding="utf-8")
          if MARKER not in text:
              base_start = text.find('def assedio(playerg,player, nemico, target, team, order, clan,meteo = None, setting = dict()):')
              base_end = text.find('\nasync def dungeon_boss', base_start)
              if base_start < 0 or base_end < 0:
                  raise RuntimeError("Base assedio non trovato")
              region = text[base_start:base_end]
              pattern = re.compile(r'(?P<i>^[ \t]*)player\["hp"\] -= dannissimi\n', re.M)
              def repl(m):
                  i = m.group('i')
                  return (
                      f'{i}player["hp"] -= dannissimi\n'
                      f'{i}if set == "Oscurato" and difesa in nemico and isinstance(nemico.get(difesa), dict):\n'
                      f'{i}    riflesso_oscuro = round(max(0, dannissimi) * proc_val("Oscurato", "assalto", "riflesso", "percento") / 100)\n'
                      f'{i}    if riflesso_oscuro > 0:\n'
                      f'{i}        nemico[difesa]["hp"] -= riflesso_oscuro\n'
                      f'{i}        player["fatto"] = player.get("fatto", 0) + riflesso_oscuro\n'
                      f'{i}        text += f"🌑 Il dolore torna indietro: {{riflesso_oscuro}} danni riflessi a {{difesa}}!\\n"\n'
                  )
              region, n_reflect = pattern.subn(repl, region)
              if n_reflect < 2:
                  raise RuntimeError(f"Riflesso assalto applicato a sole {n_reflect} sorgenti di danno")
              text = text[:base_start] + region + text[base_end:]

              text += r'''

# --- TERZA ONDATA SET: NOVE SET ---
_turno_terza_ondata_base = turno
_assedio_terza_ondata_base = assedio

def _danno_normale_terza(attaccante, difensore):
    dps = max(0, float(attaccante.get("atk", 0)))
    difesa = max(0, float(difensore.get("def", 0)))
    minimo = dps * (100 / ((100 + difesa * 1.5) + 1))
    massimo = dps * (100 / ((100 + difesa) + 1))
    return max(20, random.uniform(minimo, massimo))


def _mangia_vermi_terza(personaggio, contesto):
    if personaggio.get("set") != "Duellista vermico":
        return ""
    marker = f"_duellista_vermico_{contesto}"
    if personaggio.get(marker):
        return ""
    cfg = proc_cfg("Duellista vermico", contesto, "vermi")
    mangiati = 1 if cfg.get("primo_garantito", True) else 0
    while proc_ok(random.random(), "Duellista vermico", contesto, "vermi"):
        mangiati += 1
    if mangiati:
        personaggio["atk"] += cfg["atk"] * mangiati
        personaggio["def"] += cfg["def"] * mangiati
        personaggio["hp"] += cfg["hp"] * mangiati
    personaggio[marker] = True
    return f"🪱 {personaggio['Nome']} mangia {mangiati} verme/i: +{cfg['atk']*mangiati} ATK, +{cfg['def']*mangiati} DEF, +{cfg['hp']*mangiati} HP!\n"


def _inizializza_terza_combattimento(proprietario, avversario):
    testo = ""
    nome_set = proprietario.get("set")
    if nome_set == "Monarca oscuro" and not proprietario.get("_monarca_oscuro_inizializzato"):
        pct = proc_val(nome_set, "combattimento", "inizio", "hp_target_percento")
        prima = avversario.get("hp", 0)
        avversario["hp"] = round(prima * pct / 100)
        proprietario["_monarca_oscuro_inizializzato"] = True
        testo += f"🌑 {avversario['Nome']} entra nell'ombra del Monarca con solo il {pct}% degli HP!\n"
    if nome_set == "Re dei gadget" and not proprietario.get("_re_gadget_inizializzato"):
        bonus_int = proc_val(nome_set, "combattimento", "intelletto", "int")
        proprietario["int"] = proprietario.get("int", 0) + bonus_int
        proprietario["_re_gadget_inizializzato"] = True
        testo += f"🧰 {proprietario['Nome']} apre la collezione di gadget: +{bonus_int} INT!\n"
    if nome_set == "Il comico" and not proprietario.get("_comico_clap_combattimento"):
        proprietario["_comico_clap_combattimento"] = True
        testo += "👏 **CLAP!**\n"
    testo += _mangia_vermi_terza(proprietario, "combattimento")
    return testo


def _proc_comico_terza(proprietario, avversario):
    if proprietario.get("set") != "Il comico":
        return ""
    if not proc_ok(random.random(), "Il comico", "combattimento", "confusione"):
        return ""
    possibile = possibiles(avversario.get("agi", 0), avversario.get("agi", 0))
    if possibile > random.randint(0, 100):
        return ""
    danno = round(_danno_normale_terza(avversario, avversario))
    avversario["hp"] -= danno
    proprietario["fatto"] = proprietario.get("fatto", 0) + danno
    return f"🤡 {avversario['Nome']} è così confuso da colpirsi da solo! ({danno} danni)\n"


def _danno_su_bersaglio_terza(hp_prima, scudo_prima, bersaglio):
    danno_hp = max(0, hp_prima - bersaglio.get("hp", hp_prima))
    danno_scudo = 0
    if scudo_prima is not None:
        danno_scudo = max(0, scudo_prima - bersaglio.get("Scudo", scudo_prima))
    return danno_hp + danno_scudo


def _aggiungi_extra_terza(attaccante, bersaglio, danno_base, percento, etichetta):
    if danno_base <= 0:
        return ""
    extra = round(danno_base * percento / 100)
    if extra <= 0:
        return ""
    if "Scudo" in bersaglio and bersaglio.get("Scudo", -1) >= 0 and bersaglio.get("hp", 0) > 0:
        bersaglio["Scudo"] -= extra
    else:
        bersaglio["hp"] -= extra
    attaccante["fatto"] = attaccante.get("fatto", 0) + extra
    return f"{etichetta} +{extra} danni!\n"


def turno(main, oppo, cond=None):
    prefisso = _inizializza_terza_combattimento(main, oppo) + _inizializza_terza_combattimento(oppo, main)
    hp_turno_main = main.get("hp", 0)
    hp_turno_oppo = oppo.get("hp", 0)

    prefisso += _proc_comico_terza(main, oppo)
    prefisso += _proc_comico_terza(oppo, main)

    hp_prima = oppo.get("hp", 0)
    scudo_prima = oppo.get("Scudo") if "Scudo" in oppo else None
    testo = _turno_terza_ondata_base(main, oppo, cond)
    danno_base = _danno_su_bersaglio_terza(hp_prima, scudo_prima, oppo)

    if main.get("set") == "Demone delle lame" and danno_base > 0:
        pct = proc_val("Demone delle lame", "combattimento", "danno_extra", "percento")
        testo += _aggiungi_extra_terza(main, oppo, danno_base, pct, "🔪 Le lame trovano un secondo varco:")
    elif main.get("set") == "Cacciatore d'esce" and danno_base > 0 and proc_ok(random.random(), "Cacciatore d'esce", "combattimento", "secondo_colpo"):
        pct = proc_val("Cacciatore d'esce", "combattimento", "secondo_colpo", "percento_danno")
        testo += _aggiungi_extra_terza(main, oppo, danno_base, pct, "🎯 L'esca richiama un secondo colpo:")

    # Riflesso simultaneo: il danno riflesso non genera altro riflesso, evitando loop infiniti.
    danno_subito_main = max(0, hp_turno_main - main.get("hp", 0))
    danno_subito_oppo = max(0, hp_turno_oppo - oppo.get("hp", 0))
    if main.get("set") == "Oscurato" and danno_subito_main > 0:
        pct = proc_val("Oscurato", "combattimento", "riflesso", "percento")
        riflesso = round(danno_subito_main * pct / 100)
        if riflesso > 0:
            oppo["hp"] -= riflesso
            main["fatto"] = main.get("fatto", 0) + riflesso
            testo += f"🌑 {main['Nome']} riflette {riflesso} danni a {oppo['Nome']}!\n"
    if oppo.get("set") == "Oscurato" and danno_subito_oppo > 0:
        pct = proc_val("Oscurato", "combattimento", "riflesso", "percento")
        riflesso = round(danno_subito_oppo * pct / 100)
        if riflesso > 0:
            main["hp"] -= riflesso
            oppo["fatto"] = oppo.get("fatto", 0) + riflesso
            testo += f"🌑 {oppo['Nome']} riflette {riflesso} danni a {main['Nome']}!\n"

    return prefisso + testo


def _last_recenti_terza(clan, team, nome, finestra):
    ora = time.time()
    recenti = 0
    try:
        last = clan[team].get("last", {})
    except Exception:
        return 0
    for giocatore, timestamp in last.items():
        try:
            if giocatore != nome and ora - float(timestamp) < finestra:
                recenti += 1
        except Exception:
            continue
    return recenti


def assedio(playerg, player, nemico, target, team, order, clan, meteo=None, setting=dict()):
    prefisso = ""
    nome_set = player.get("set")
    prefisso += _mangia_vermi_terza(player, "assalto")
    if nome_set == "Il comico":
        prefisso += "👏 **CLAP!**\n"

    danno_monarca = 0
    if nome_set == "Monarca oscuro" and target in nemico and isinstance(nemico.get(target), dict):
        cfg = proc_cfg(nome_set, "assalto", "last")
        quanti = _last_recenti_terza(clan, team, player.get("Nome"), cfg["finestra_secondi"])
        danno_monarca = cfg["danno_per_last"] * quanti
        if danno_monarca > 0:
            nemico[target]["hp"] -= danno_monarca
            prefisso += f"🌑 Le ombre di {quanti} assaltatori recenti colpiscono {target} per {danno_monarca} danni!\n"

    hp_target_prima = None
    if target in nemico and isinstance(nemico.get(target), dict):
        hp_target_prima = nemico[target].get("hp", 0)

    testo = _assedio_terza_ondata_base(playerg, player, nemico, target, team, order, clan, meteo, setting)
    if danno_monarca > 0:
        player["fatto"] = player.get("fatto", 0) + danno_monarca

    if hp_target_prima is not None and target in nemico and isinstance(nemico.get(target), dict):
        danno_base = max(0, hp_target_prima - nemico[target].get("hp", hp_target_prima))
        extra = 0
        etichetta = ""
        if nome_set == "Demone delle lame" and danno_base > 0:
            pct = proc_val(nome_set, "assalto", "danno_extra", "percento")
            extra = round(danno_base * pct / 100)
            etichetta = "🔪 Le lame approfondiscono il colpo"
        elif nome_set == "Cacciatore d'esce" and danno_base > 0 and proc_ok(random.random(), nome_set, "assalto", "secondo_colpo"):
            pct = proc_val(nome_set, "assalto", "secondo_colpo", "percento_danno")
            extra = round(danno_base * pct / 100)
            etichetta = "🎯 L'esca richiama un secondo colpo"
        if extra > 0:
            nemico[target]["hp"] -= extra
            player["fatto"] = player.get("fatto", 0) + extra
            testo += f"{etichetta}: +{extra} danni a {target}!\n"
            if nemico[target].get("hp", 0) <= 0:
                nemico.pop(target, None)
                testo += "**E' andata!!**\n"

    return prefisso + testo
'''
              p.write_text(text, encoding="utf-8")

          # Rimuove il workflow temporaneo nel commit finale.
          wf = Path(".github/workflows/add_nove_set.yml")
          if wf.exists():
              wf.unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile liste.py bilanciamento.py frasi_set.py nft.py
          python - <<'PY'
          import liste
          from bilanciamento import PROC_CLASSI
          from frasi_set import FRASI_SET_TECNICHE

          attesi = {
              "Monarca oscuro": ("Palla Ombra", "Scudo d'ossidiana"),
              "Oscurato": ("NotteSferza", "Teschio d'ossidiana"),
              "Demone delle lame": ("Coltelli da lancio", "Un machete"),
              "Re dei gadget": ("Bomba sneaky", "Bastone sferico"),
              "Il comico": ("Bomba sneaky", "Sgabello da bar"),
              "Survival medievale": ("Spada della vitalità", "Un armatura in filo spinato"),
              "Duellista vermico": ("Spada d'oro fortissima", "Secchiello di vermi"),
              "Cacciatore d'esce": ("Coltelli da lancio", "Armatura di esche"),
              "Duro a morire": ("Stecca di ferro", "Un tavolo speziato"),
          }
          armi = {x.split(" LV")[0] for x in liste.armi}
          protezioni = {x.split(" LV")[0] for x in liste.protezioni}
          for nome, (arma, protezione) in attesi.items():
              assert liste.classi[nome] == [arma, protezione], (nome, liste.classi[nome])
              assert arma in armi, (nome, arma)
              assert protezione in protezioni, (nome, protezione)
              assert nome in liste.Approccini
              assert nome in liste.bonus
              assert nome in liste.frasi_set
              assert nome in PROC_CLASSI
              assert nome in FRASI_SET_TECNICHE

          assert liste.bonus["Survival medievale"] == {"hp": 500, "def": 0, "atk": 0, "agi": 0}
          assert liste.bonus["Duro a morire"] == {"hp": 0, "def": 222, "atk": 0, "agi": 0}
          assert PROC_CLASSI["Monarca oscuro"]["combattimento"]["inizio"]["hp_target_percento"] == 60
          assert PROC_CLASSI["Oscurato"]["combattimento"]["riflesso"]["percento"] == 5
          assert PROC_CLASSI["Demone delle lame"]["combattimento"]["danno_extra"]["percento"] == 20
          assert PROC_CLASSI["Demone delle lame"]["assalto"]["danno_extra"]["percento"] == 30
          assert PROC_CLASSI["Il comico"]["combattimento"]["confusione"]["proc"] == 15
          assert PROC_CLASSI["Duellista vermico"]["combattimento"]["vermi"]["proc"] == 11
          assert PROC_CLASSI["Cacciatore d'esce"]["combattimento"]["secondo_colpo"] == {"proc": 40, "percento_danno": 50}

          nft = open("nft.py", encoding="utf-8").read()
          assert "_turno_terza_ondata_base = turno" in nft
          assert "_assedio_terza_ondata_base = assedio" in nft
          assert "COMBATTIMENTO" in FRASI_SET_TECNICHE["Monarca oscuro"]
          assert nft.count('set == "Oscurato" and difesa in nemico') >= 2
