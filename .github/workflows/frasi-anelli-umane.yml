name: Frasi umane anelli

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Integra renderer e valida 52 anelli
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import string

          nft_path = Path('nft.py')
          nft = nft_path.read_text(encoding='utf-8')

          # Corregge il formato della Proteina: 1.8 significa +180% extra, non 1.8%.
          frasi_path = Path('frasi_anelli.py')
          frasi = frasi_path.read_text(encoding='utf-8')
          frasi = frasi.replace('{turno.massa.moltiplicatore_extra_dps:pct}', '{turno.massa.moltiplicatore_extra_dps:pct_mul}')
          frasi_path.write_text(frasi, encoding='utf-8')

          import_old = 'from frasi_set import FRASI_SET_TECNICHE\n'
          import_new = import_old + 'from frasi_anelli import FRASI_ANELLI_TECNICHE\n'
          if 'from frasi_anelli import FRASI_ANELLI_TECNICHE' not in nft:
              if import_old not in nft:
                  raise RuntimeError('Import FRASI_SET_TECNICHE non trovato')
              nft = nft.replace(import_old, import_new, 1)

          fmt_old = '''    if formato == "rid_pct":\n        return f"{_numero_placeholder_tecnico((1 - float(valore)) * 100)}%"\n'''
          fmt_new = '''    if formato == "rid_pct":\n        return f"{_numero_placeholder_tecnico((1 - float(valore)) * 100)}%"\n    if formato == "pct_mul":\n        return f"{_numero_placeholder_tecnico(float(valore) * 100)}%"\n'''
          if 'if formato == "pct_mul":' not in nft:
              if fmt_old not in nft:
                  raise RuntimeError('Blocco rid_pct non trovato')
              nft = nft.replace(fmt_old, fmt_new, 1)

          old_desc = '''def descrizione_anello_tecnica(nome):\n    """Descrizione meccanica dell'anello, generata direttamente da PROC_ANELLI."""\n    righe = ["⚙️ Dettagli tecnici"]\n    righe.extend(_righe_config_tecnica(PROC_ANELLI.get(nome, {})))\n    if len(righe) == 1:\n        righe.append("• Nessun parametro numerico centralizzato per questo anello.")\n    return "\\n".join(righe)\n'''

          new_desc = '''def _valore_placeholder_anello(nome, percorso):\n    valore = PROC_ANELLI.get(nome, {})\n    for parte in percorso.split("."):\n        if not isinstance(valore, dict) or parte not in valore:\n            raise KeyError(f"Placeholder anello non valido: {nome}.{percorso}")\n        valore = valore[parte]\n    return valore\n\n\ndef render_frase_anello_tecnica(nome):\n    template = FRASI_ANELLI_TECNICHE.get(nome, "")\n    if not template:\n        return ""\n    parti = []\n    for letterale, campo, formato, conversione in string.Formatter().parse(template):\n        parti.append(letterale)\n        if campo is None:\n            continue\n        if conversione:\n            raise ValueError(f"Conversione placeholder non supportata: {conversione}")\n        valore = _valore_placeholder_anello(nome, campo)\n        parti.append(_format_placeholder_set(valore, formato))\n    return "".join(parti)\n\n\ndef descrizione_anello_tecnica(nome):\n    """Descrizione leggibile dell'anello, sempre allineata a PROC_ANELLI."""\n    righe = ["⚙️ Dettagli dell'anello"]\n    frase = render_frase_anello_tecnica(nome)\n    if frase:\n        righe.append(frase)\n    return "\\n".join(righe)\n'''

          if 'def render_frase_anello_tecnica(' not in nft:
              if old_desc not in nft:
                  raise RuntimeError('Vecchia descrizione_anello_tecnica non trovata')
              nft = nft.replace(old_desc, new_desc, 1)

          # Evita duplicazioni se l'aggiornamento descrizioni viene richiamato più volte.
          old_marker = '''    marker = "\\n\\n⚙️ Dettagli tecnici"\n\n    for nome in liste_module.classi:\n        base = liste_module.frasi_set.get(nome, f"Set del {nome}.")\n        base = base.split(marker, 1)[0].rstrip()\n'''
          new_marker = '''    markers = ("\\n\\n⚙️ Dettagli tecnici", "\\n\\n⚙️ Dettagli del set", "\\n\\n⚙️ Dettagli dell'anello")\n\n    for nome in liste_module.classi:\n        base = liste_module.frasi_set.get(nome, f"Set del {nome}.")\n        for marker in markers:\n            base = base.split(marker, 1)[0]\n        base = base.rstrip()\n'''
          if old_marker in nft:
              nft = nft.replace(old_marker, new_marker, 1)

          old_ring_strip = '''    for nome in list(liste_module.anelli):\n        base = liste_module.anelli[nome]\n        base = base.split(marker, 1)[0].rstrip()\n        liste_module.anelli[nome] = base + "\\n\\n" + descrizione_anello_tecnica(nome)\n'''
          new_ring_strip = '''    for nome in list(liste_module.anelli):\n        base = liste_module.anelli[nome]\n        for marker in markers:\n            base = base.split(marker, 1)[0]\n        base = base.rstrip()\n        liste_module.anelli[nome] = base + "\\n\\n" + descrizione_anello_tecnica(nome)\n'''
          if old_ring_strip in nft:
              nft = nft.replace(old_ring_strip, new_ring_strip, 1)

          nft_path.write_text(nft, encoding='utf-8')

          # Validazione senza importare nft/pyrogram.
          ns_liste = {}
          exec(Path('liste.py').read_text(encoding='utf-8'), ns_liste)
          ns_bal = {}
          exec(Path('bilanciamento.py').read_text(encoding='utf-8'), ns_bal)
          ns_frasi = {}
          exec(Path('frasi_anelli.py').read_text(encoding='utf-8'), ns_frasi)

          anelli = ns_liste['anelli']
          proc = ns_bal['PROC_ANELLI']
          templates = ns_frasi['FRASI_ANELLI_TECNICHE']

          if set(templates) != set(anelli):
              mancanti = sorted(set(anelli) - set(templates))
              extra = sorted(set(templates) - set(anelli))
              raise RuntimeError(f'Frasi anelli non 1:1. Mancanti={mancanti}; extra={extra}')
          if len(templates) != 52:
              raise RuntimeError(f'Attesi 52 anelli, trovati {len(templates)}')
          if len(set(templates.values())) != len(templates):
              raise RuntimeError('Esistono frasi anello duplicate')

          formati = {'', 'pct', 'x', 'signed', 'abs', 'bool', 'rid_pct', 'pct_mul'}
          for nome, template in templates.items():
              for _, campo, formato, conversione in string.Formatter().parse(template):
                  if campo is None:
                      continue
                  if conversione:
                      raise RuntimeError(f'Conversione non ammessa: {nome} -> {campo}')
                  if formato not in formati:
                      raise RuntimeError(f'Formato non ammesso: {nome} -> {formato}')
                  valore = proc.get(nome, {})
                  for parte in campo.split('.'):
                      if not isinstance(valore, dict) or parte not in valore:
                          raise RuntimeError(f'Placeholder inesistente: {nome} -> {campo}')
                      valore = valore[parte]

          print(f'OK: {len(templates)} anelli, 52 frasi distinte, placeholder validi')
          PY

          python -m py_compile nft.py bilanciamento.py frasi_set.py frasi_anelli.py

      - name: Commit e pulizia workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py frasi_anelli.py
          git rm -- .github/workflows/frasi-anelli-umane.yml
          git commit -m "feat: rendi leggibili le descrizioni degli anelli"
          git push origin HEAD:refactor/bilanciamento-config
