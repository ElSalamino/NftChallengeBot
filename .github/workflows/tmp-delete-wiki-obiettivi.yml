name: Cleanup ramo Wiki obiettivi

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-delete-wiki-obiettivi.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Elimina ramo temporaneo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/delete.out -w '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/wiki-obiettivi-cataloghi")
          test "$code" = "204"

          branches=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches?per_page=100")
          test "$(echo "$branches" | jq 'length')" -eq 1
          test "$(echo "$branches" | jq -r '.[0].name')" = "main"
