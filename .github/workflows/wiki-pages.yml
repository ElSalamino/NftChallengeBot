name: Wiki procedurale

on:
  push:
    branches:
      - main
    paths:
      - "liste.py"
      - "set_raw_balance.py"
      - "bilanciamento.py"
      - "settimanale.py"
      - "frasi_*.py"
      - "nft.py"
      - "turno_assalto.py"
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "liste.py"
      - "set_raw_balance.py"
      - "bilanciamento.py"
      - "settimanale.py"
      - "frasi_*.py"
      - "nft.py"
      - "turno_assalto.py"
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera wiki dai dati del gioco
        run: |
          python -m py_compile wiki/genera_wiki_v2.py wiki/genera_wiki_v3.py wiki/genera_wiki_v4.py wiki/genera_wiki_v5.py wiki/genera_wiki_v6.py wiki/genera_wiki_v7.py wiki/genera_wiki_v8.py wiki/genera_wiki_v9.py wiki/run_wiki.py wiki/validate_wiki.py wiki/validate_wiki_v4.py liste.py set_raw_balance.py bilanciamento.py settimanale.py frasi_set.py frasi_anelli.py frasi_incantesimi.py frasi_usabili.py
          python - <<'PY'
          import random
          import liste
          import settimanale

          originali = liste.bonus_punteggio_originale
          finali = liste.bonus_punteggio
          set_zero = [nome for nome in liste.classi if originali.get(nome, 0) == 0]
          set_raw = [nome for nome in liste.classi if originali.get(nome, 0) > 0]

          assert all(finali[nome] == 0 for nome in set_zero), [nome for nome in set_zero if finali[nome] != 0]
          assert all(all(int(liste.bonus[nome].get(stat, 0)) == 0 for stat in ('hp', 'atk', 'def', 'agi')) for nome in set_zero)
          assert all(finali[nome] >= liste.SET_RAW_TARGET for nome in set_raw), [(nome, finali[nome]) for nome in set_raw if finali[nome] < liste.SET_RAW_TARGET]
          assert all(finali[nome] >= originali[nome] for nome in set_raw)

          rng = random.Random(12345)
          estratti = [settimanale.estrai_premio_oro_settimanale(rng=rng) for _ in range(500)]
          for premio in estratti:
              if " LV" in premio:
                  lv = int(premio.rsplit(" LV", 1)[1])
                  assert 0 <= lv <= 4, premio
          assert set(settimanale.SOGLIE_PREMI_ORO_SETTIMANALE) == {8.4, 8.8, 9.6}
          print(f"Raw set: {len(set_raw)} normalizzati; {len(set_zero)} intenzionalmente a zero")
          print("Settimanale oro: livelli limitati a LV0-LV4")
          PY
          python wiki/validate_wiki_v4.py
          python wiki/run_wiki.py --output _site
          test -s _site/index.html
          test -s _site/data.json

          python - <<'PY'
          import json
          import liste

          with open('_site/data.json', encoding='utf-8') as fh:
              data = json.load(fh)

          assert data['meta']['wiki_version'] == 9
          assert {x['name'] for x in data['achievements']} == set(liste.descri)
          assert all(x['cap_bonus'] == 10 for x in data['achievements'])
          assert data['achievement_system']['cap_bonus_each'] == 10
          assert len(data['marine_bosses']) == len(liste.Nautici)
          assert {'Kraken Nautico', 'Balena territoriale', 'Granchio da rave'} <= {x['name'] for x in data['marine_bosses']}

          collectible_names = {x['name'] for x in data['items'] if x.get('is_collectible')}
          usable_names = {x['name'] for x in data['items'] if x.get('is_usable')}
          assert set(liste.decoro) <= collectible_names
          assert set(liste.usabili) <= usable_names
          print(f"Wiki v9: {len(data['achievements'])} obiettivi, {len(collectible_names)} collezionabili, {len(usable_names)} usabili")
          PY

          grep -q "Boss giornaliero" _site/index.html
          grep -q "Statistiche a ogni livello" _site/index.html
          grep -q "Casa nemici dungeon" _site/index.html
          grep -q "Approcci" _site/index.html
          grep -q "Nuclei" _site/index.html
          grep -q "Weekend, eventi e modificatori" _site/index.html
          grep -q "Scaglioni per LVMAX" _site/index.html
          grep -q "Statistiche LV0 → LVMAX" _site/index.html
          grep -q "Effetto tecnico dell’usabile" _site/index.html
          grep -Eq "Funzionamento tecnico completo|Effetto della modalità" _site/index.html
          grep -q "Punteggio raw" _site/index.html
          grep -q "HP ×1 · ATK ×4 · DEF ×4 · AGI ×20" _site/index.html
          grep -Eq "20% di probabilità di distrarre l'attaccante|20% di probabilità di forzare l'attaccante a colpire il Bersaglio enorme" _site/index.html
          grep -q "Cura ogni struttura del villaggio di 3 HP per ogni livello della Centrale" _site/index.html
          grep -q "3 HP × livello della Centrale × numero di strutture presenti" _site/index.html
          grep -q "Premio della Settimanale" _site/index.html
          grep -q "LV0 e LV4" _site/index.html

          # Wiki v8: Forme Mega + guida pesca.
          grep -q "Come si ottiene / attiva la Forma Mega" _site/index.html
          grep -q "Mixa/equipaggia insieme 2 item del Megaevento" _site/index.html
          grep -q "Neo blaster" _site/index.html
          grep -q "Chip terra" _site/index.html
          grep -q "Potere di pesca" _site/index.html
          grep -q "Pesci per location" _site/index.html
          grep -q "Sacca e futuro uso come ingredienti" _site/index.html
          grep -q "Richieste del Pescatore" _site/index.html
          grep -q "Lotte marine" _site/index.html
          grep -q "Kraken Nautico" _site/index.html
          grep -q "allneed è formato da tutti i pesci" _site/index.html

          # Wiki v9: cataloghi, obiettivi, boss marini e Ambrosia completa.
          grep -q "Collezionabili" _site/index.html
          grep -q "Consumabili e oggetti attivabili" _site/index.html
          grep -q "Tutti i traguardi del profilo" _site/index.html
          grep -q "Bonus per ogni obiettivo" _site/index.html
          grep -q "4.500 sfide totali" _site/index.html
          grep -q "Apri statistiche e drop" _site/index.html
          grep -q "Boss delle lotte marine: statistiche base e drop" _site/index.html
          grep -q "ATK viene moltiplicato ×10" _site/index.html
          grep -q "DEF ×10000" _site/index.html

          ! grep -q "generale.distrazione_proc=" _site/index.html
          ! grep -q "sistema.scaling.divisore_livello=" _site/index.html
          ! grep -q "Variabili tecniche" _site/index.html
          ! grep -Eqi "attacco_diretto=(true|false)" _site/index.html

      - name: Carica artifact Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Pubblica wiki
        id: deployment
        uses: actions/deploy-pages@v4
