name: Wiki procedurale

on:
  push:
    branches:
      - main
    paths:
      - "liste.py"
      - "set_raw_balance.py"
      - "bilanciamento.py"
      - "dungeon_extra.py"
      - "settimanale.py"
      - "frasi_*.py"
      - "nft.py"
      - "turno_assalto.py"
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "liste.py"
      - "set_raw_balance.py"
      - "bilanciamento.py"
      - "dungeon_extra.py"
      - "settimanale.py"
      - "frasi_*.py"
      - "nft.py"
      - "turno_assalto.py"
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera wiki dai dati del gioco
        run: |
          python -m py_compile wiki/genera_wiki_v2.py wiki/genera_wiki_v3.py wiki/genera_wiki_v4.py wiki/genera_wiki_v5.py wiki/genera_wiki_v6.py wiki/genera_wiki_v7.py wiki/genera_wiki_v8.py wiki/genera_wiki_v9.py wiki/genera_wiki_v10.py wiki/genera_wiki_v11.py wiki/genera_wiki_v12.py wiki/run_wiki.py wiki/validate_wiki.py wiki/validate_wiki_v4.py liste.py set_raw_balance.py bilanciamento.py dungeon_extra.py settimanale.py frasi_set.py frasi_anelli.py frasi_incantesimi.py frasi_usabili.py
          python - <<'PY'
          import random
          import liste
          import settimanale
          import bilanciamento
          from dungeon_extra import (
              podio_probabilita_pct,
              podio_livello_premio,
              podio_penalita_gloria,
              podio_applica_penalita,
              scegli_nemici_imboscata,
          )

          originali = liste.bonus_punteggio_originale
          finali = liste.bonus_punteggio
          set_zero = [nome for nome in liste.classi if originali.get(nome, 0) == 0]
          set_raw = [nome for nome in liste.classi if originali.get(nome, 0) > 0]

          assert all(finali[nome] == 0 for nome in set_zero), [nome for nome in set_zero if finali[nome] != 0]
          assert all(all(int(liste.bonus[nome].get(stat, 0)) == 0 for stat in ('hp', 'atk', 'def', 'agi')) for nome in set_zero)
          assert all(finali[nome] >= liste.SET_RAW_TARGET for nome in set_raw), [(nome, finali[nome]) for nome in set_raw if finali[nome] < liste.SET_RAW_TARGET]
          assert all(finali[nome] >= originali[nome] for nome in set_raw)

          rng = random.Random(12345)
          estratti = [settimanale.estrai_premio_oro_settimanale(rng=rng) for _ in range(500)]
          for premio in estratti:
              if " LV" in premio:
                  lv = int(premio.rsplit(" LV", 1)[1])
                  assert 0 <= lv <= 4, premio
          assert set(settimanale.SOGLIE_PREMI_ORO_SETTIMANALE) == {8.4, 8.8, 9.6}

          # Dungeon Podio + imboscate.
          assert "Podio" in liste.stanze
          assert all(x in liste.scelte for x in ("1° posto", "2° posto", "3° posto"))
          assert bilanciamento.DUNGEON_CONFIG["generale"]["imboscata"] == {"proc": 0.5, "nemici": 2}
          totale = len(liste.descri)
          assert totale > 0
          assert [podio_probabilita_pct(totale, totale, x) for x in (1, 2, 3)] == [100, 100, 100]
          assert [podio_probabilita_pct(26, 52, x) for x in (1, 2, 3)] == [50, 100, 100]
          assert [podio_livello_premio(x) for x in (1, 2, 3)] == [3, 2, 1]
          assert [podio_penalita_gloria(x) for x in (1, 2, 3)] == [10, 8, 6]
          assert podio_applica_penalita(4, 10) == (0, 4)
          scelti = scegli_nemici_imboscata(["a", "b", "c", "d"], ["a", "b"], 2, random.Random(3))
          assert len(scelti) == 2 and all(x not in {"a", "b"} for x in scelti)

          # Dono stellare + approcci differenziati.
          dono = liste.protezioniextra['Dono stellare']
          assert {k: dono[k] for k in ('hp','atk','def','agi')} == {'hp':680,'atk':165,'def':165,'agi':34}
          assert sum(dono[s] * liste.SET_RAW_WEIGHTS[s] for s in ('hp','atk','def','agi')) == 2680
          assert liste.DONO_STELLARE_RAW_SCORE == 2680
          assert liste.Approcci['Aggressivo'] == {'hp':1,'def':.6,'atk':1.5,'agi':.9,'Ap':'Base'}
          assert liste.Approcci['Spavaldo'] == {'hp':.8,'def':.5,'atk':1.7,'agi':1,'Ap':'Base'}
          assert all('Dono stellare' not in (x or []) for x in liste.classi.values())

          print(f"Raw set: {len(set_raw)} normalizzati; {len(set_zero)} intenzionalmente a zero")
          print("Settimanale oro: livelli limitati a LV0-LV4")
          print("Dungeon: Podio e imboscate verificati")
          print("Dono stellare: 2680 raw distribuiti; Aggressivo/Spavaldo differenziati")
          PY
          python wiki/validate_wiki_v4.py
          python wiki/run_wiki.py --output _site
          test -s _site/index.html
          test -s _site/data.json

          python - <<'PY'
          import json
          import liste

          with open('_site/data.json', encoding='utf-8') as fh:
              data = json.load(fh)

          assert data['meta']['wiki_version'] == 12
          assert {x['name'] for x in data['achievements']} == set(liste.descri)
          assert all(x['cap_bonus'] == 10 for x in data['achievements'])
          assert data['achievement_system']['cap_bonus_each'] == 10
          assert len(data['marine_bosses']) == len(liste.Nautici)
          assert {'Kraken Nautico', 'Balena territoriale', 'Granchio da rave'} <= {x['name'] for x in data['marine_bosses']}

          collectible_names = {x['name'] for x in data['items'] if x.get('is_collectible')}
          usable_names = {x['name'] for x in data['items'] if x.get('is_usable')}
          assert set(liste.decoro) <= collectible_names
          assert set(liste.usabili) <= usable_names

          extra = data['dungeon_additions']
          assert extra['podium']['room'] == 'Podio'
          assert [x['max_chance_pct'] for x in extra['podium']['positions']] == [100, 100, 100]
          assert [x['reward_level'] for x in extra['podium']['positions']] == [3, 2, 1]
          assert [x['glory_loss'] for x in extra['podium']['positions']] == [10, 8, 6]
          assert extra['ambush']['proc_pct'] == 0.5
          assert extra['ambush']['enemies'] == 2
          assert extra['ambush']['message'] == "Mentre giravi per il dungeon un gruppo di loschi figuri si avvicina, è un imboscata!"

          rooms = data['dungeon']['rooms']
          assert len(rooms) == 31
          assert data['dungeon_room_guide']['count'] == 31
          assert all(r.get('guide') for r in rooms)
          assert all(r['guide'].get('summary') and r['guide'].get('category') for r in rooms)
          by_room = {r['name']: r for r in rooms}
          assert len(by_room['Arena']['guide']['actions']) == 3
          assert 'AGI' in {a['stat'] for a in by_room['Arena']['guide']['actions']}
          assert '54%' in by_room['Fonte magica']['guide']['actions'][0]['chance']
          assert 'LV2' in by_room['Faro']['guide']['actions'][0]['success']
          assert 'irraggiungibile' in by_room['Lupo solitario']['guide']['actions'][0]['note']
          assert '30%' in by_room['Biblioteca']['guide']['summary']
          assert '123' in by_room['Chiesa']['guide']['actions'][0]['failure']

          # Wiki v12: raw score su equip, nemici, boss e Dono.
          assert data['raw_score_system']['formula'] == 'HP ×1 · ATK ×4 · DEF ×4 · AGI ×20'
          assert all('raw_score' in x for x in data['enemies'])
          assert all('raw_score' in x for x in data['bosses'])
          assert all('raw_score' in x for x in data['marine_bosses'])
          equip = [x for x in data['items'] if x.get('levels')]
          assert equip and all(x.get('raw_score') is not None for x in equip)
          dono = next(x for x in data['items'] if x['name'] == 'Dono stellare')
          assert dono['raw_score'] == 2680
          assert dono['dono_stellare']['stats'] == {'hp':680,'atk':165,'def':165,'agi':34}
          assert dono['dono_stellare']['contributions'] == {'hp':680,'atk':660,'def':660,'agi':680}

          print(f"Wiki v12: {len(data['achievements'])} obiettivi; {len(rooms)} stanze; raw score esteso")
          PY

          grep -q "Boss giornaliero" _site/index.html
          grep -q "Statistiche a ogni livello" _site/index.html
          grep -q "Casa nemici dungeon" _site/index.html
          grep -q "Approcci" _site/index.html
          grep -q "Nuclei" _site/index.html
          grep -q "Weekend, eventi e modificatori" _site/index.html
          grep -q "Scaglioni per LVMAX" _site/index.html
          grep -q "Statistiche LV0 → LVMAX" _site/index.html
          grep -q "Effetto tecnico dell’usabile" _site/index.html
          grep -Eq "Funzionamento tecnico completo|Effetto della modalità" _site/index.html
          grep -q "Punteggio raw" _site/index.html
          grep -q "HP ×1 · ATK ×4 · DEF ×4 · AGI ×20" _site/index.html
          grep -Eq "20% di probabilità di distrarre l'attaccante|20% di probabilità di forzare l'attaccante a colpire il Bersaglio enorme" _site/index.html
          grep -q "Cura ogni struttura del villaggio di 3 HP per ogni livello della Centrale" _site/index.html
          grep -q "3 HP × livello della Centrale × numero di strutture presenti" _site/index.html
          grep -q "Premio della Settimanale" _site/index.html
          grep -q "LV0 e LV4" _site/index.html

          # Wiki v8: Forme Mega + guida pesca.
          grep -q "Come si ottiene / attiva la Forma Mega" _site/index.html
          grep -q "Mixa/equipaggia insieme 2 item del Megaevento" _site/index.html
          grep -q "Neo blaster" _site/index.html
          grep -q "Chip terra" _site/index.html
          grep -q "Potere di pesca" _site/index.html
          grep -q "Pesci per location" _site/index.html
          grep -q "Sacca e futuro uso come ingredienti" _site/index.html
          grep -q "Richieste del Pescatore" _site/index.html
          grep -q "Lotte marine" _site/index.html
          grep -q "Kraken Nautico" _site/index.html
          grep -q "allneed è formato da tutti i pesci" _site/index.html

          # Wiki v9: cataloghi, obiettivi, boss marini e Ambrosia completa.
          grep -q "Collezionabili" _site/index.html
          grep -q "Consumabili e oggetti attivabili" _site/index.html
          grep -q "Tutti i traguardi del profilo" _site/index.html
          grep -q "Bonus per ogni obiettivo" _site/index.html
          grep -q "4.500 sfide totali" _site/index.html
          grep -q "Apri statistiche e drop" _site/index.html
          grep -q "Boss delle lotte marine: statistiche base e drop" _site/index.html
          grep -q "ATK viene moltiplicato ×10" _site/index.html
          grep -q "DEF ×10000" _site/index.html

          # Wiki v10: Podio e imboscate.
          grep -q "Podio" _site/index.html
          grep -q "obiettivi completati /" _site/index.html
          grep -q "1 significa 100%" _site/index.html
          grep -q "oggetto casuale LV3" _site/index.html
          grep -q "10 Gloria" _site/index.html
          grep -q "0,5% di probabilità di imboscata" _site/index.html
          grep -q "Mentre giravi per il dungeon un gruppo di loschi figuri si avvicina, è un imboscata!" _site/index.html
          grep -q "Mostri aggiunti" _site/index.html

          # Wiki v11: guida completa e leggibile delle 31 stanze.
          grep -q "Guida alle stanze" _site/index.html
          grep -q "Come leggere le stanze" _site/index.html
          grep -q "Probabilità di comparsa" _site/index.html
          grep -q "Comportamento attuale" _site/index.html
          grep -q "Prova di statistiche" _site/index.html
          grep -q "Upgrade LVX" _site/index.html
          grep -q "30% dei casi trovi un libro" _site/index.html
          grep -q "123 danno dungeon" _site/index.html

          # Wiki v12: raw score esteso e Dono stellare.
          grep -q "Come sono determinate le raw stats" _site/index.html
          grep -q "Contributi raw" _site/index.html
          grep -q "Statistiche base" _site/index.html

          ! grep -q "generale.distrazione_proc=" _site/index.html
          ! grep -q "sistema.scaling.divisore_livello=" _site/index.html
          ! grep -q "Variabili tecniche" _site/index.html
          ! grep -Eqi "attacco_diretto=(true|false)" _site/index.html

      - name: Carica artifact Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Pubblica wiki
        id: deployment
        uses: actions/deploy-pages@v4
