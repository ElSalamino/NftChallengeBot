name: Raffina Cangiante e Onde

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - '.github/workflows/raffina-cangiante-onde.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Applica modifiche
        run: python .github/scripts/raffina_cangiante_onde.py

      - name: Verifica sintassi
        run: python -m py_compile nft.py bilanciamento.py frasi_incantesimi.py liste.py

      - name: Verifica Cangiante e Onde
        run: |
          python - <<'PY'
          import bilanciamento
          import liste
          import frasi_incantesimi
          from pathlib import Path

          solo_stats = [
              nome for nome in liste.classi
              if bilanciamento.PROC_CLASSI.get(nome, {}).get('generale', {}).get('set_base', {}).get('solo_bonus_base', False)
          ]
          assert solo_stats, 'Nessun set solo stats trovato'
          cfg = bilanciamento.INCANTESIMI_CONFIG['Cangiante']['generale']['selezione_set']
          assert cfg['escludi_solo_bonus_base'] is True

          nft = Path('nft.py').read_text(encoding='utf-8')
          assert 'def set_cangiante_disponibili()' in nft
          assert nft.count('random.choice(set_cangiante_disponibili())') == 2
          assert 'random.choice(list(classi))' not in nft

          frase = frasi_incantesimi.FRASI_INCANTESIMI_TECNICHE['Cangiante']
          assert 'soltanto statistiche base' in frase
          assert liste.libri["Le migliori location per il surf"]['descrizione'] == "Cavalca le onde dell'abisso e lascia che sia il mare a sfondare le difese davanti a te."

          print('Set esclusi da Cangiante:', len(solo_stats))
          print(', '.join(solo_stats))
          print('OK')
          PY

      - name: Commit finale
        run: |
          git restore __pycache__ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nft.py bilanciamento.py frasi_incantesimi.py liste.py
          git rm -f .github/workflows/raffina-cangiante-onde.yml .github/scripts/raffina_cangiante_onde.py
          git commit -m "fix: filtra i set solo stats da Cangiante"
          git push origin refactor/bilanciamento-config
