name: Apply quinta ondata set

on:
  push:
    branches:
      - feature/set-eroi-tempesta
    paths:
      - apply_quinta_ondata.py
      - .github/workflows/apply_quinta_ondata.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python apply_quinta_ondata.py
      - name: Validate syntax and data
        run: |
          python -m py_compile liste.py bilanciamento.py frasi_set.py nft.py
          python - <<'PY'
          from liste import classi, Approccini, bonus, frasi_set, armi, protezioni, armiextra, protezioniextra
          from bilanciamento import PROC_CLASSI
          from frasi_set import FRASI_SET_TECNICHE

          nuovi = {
              "Nucleo dell'uragano": ["Uncino rituale", "Origine della tempesta"],
              "Tormento di fuoco": ["Spada del dio della fucina", "Origine della tempesta"],
              "Girarrosto": ["Frusta di salsiccia", "Bastone sferico"],
              "Venere di ferro": ["Spina insanguinata", "Scaglioni pesanti"],
              "Rosso D'ossidina": ["Canna rossa", "Scudo d'ossidiana"],
              "Oltraggioso": ["Blasfemia", "Armatura pesantissima"],
              "Festante oscuro": ["Palla Ombra", "Corona del rave"],
              "Legionaro di Evelin": ["Corvo amichevole", "Scudo del comandante"],
              "Neo Genesi": ["Spada a protoni", "Piuma celeste"],
              "Intermezzo": ["Lancia celeste", "Palla chiodata"],
              "Obscurio": ["Palla Ombra", "Velo di catena"],
              "Primo al comando": ["Martello del folle", "Scudo del comandante"],
              "Luce persa": ["Spada del crociato", "Anima dispersa"],
          }
          weapons = set(armi) | set(armiextra)
          protections = set(protezioni) | set(protezioniextra)
          for nome, coppia in nuovi.items():
              assert classi[nome] == coppia, (nome, classi.get(nome), coppia)
              assert coppia[0] in weapons, (nome, "arma", coppia[0])
              assert coppia[1] in protections, (nome, "protezione", coppia[1])
              assert nome in Approccini
              assert nome in bonus
              assert nome in frasi_set
              assert nome in PROC_CLASSI
              assert nome in FRASI_SET_TECNICHE

          assert PROC_CLASSI["Venere di ferro"]["combattimento"]["riduzione_danno"]["percento"] == 20
          assert PROC_CLASSI["Venere di ferro"]["assalto"]["riduzione_danno"]["percento"] == 30
          assert PROC_CLASSI["Oltraggioso"]["combattimento"]["cap_danno"]["massimo"] == 50
          assert PROC_CLASSI["Girarrosto"]["combattimento"]["salvezza"]["hp_soglia_percento"] == 50
          assert PROC_CLASSI["Nucleo dell'uragano"]["combattimento"]["proc_anello_avversario"]["percento_atk_proprio"] == 10
          assert PROC_CLASSI["Tormento di fuoco"]["combattimento"]["proc_anello_avversario"]["percento_atk_avversario"] == 10
          assert PROC_CLASSI["Primo al comando"]["combattimento"]["proc_anello"]["cura"] == 30
          assert PROC_CLASSI["Legionaro di Evelin"]["combattimento"]["danno_turno"]["danno"] == 50
          assert PROC_CLASSI["Neo Genesi"]["combattimento"]["danno_turno"]["danno"] == 50
          print("catalogo e tuning OK")
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path("nft.py").read_text(encoding="utf-8")
          richiesti = [
              "class _CombattenteQuinta",
              "def _risolvi_proc_anelli_quinta",
              "def _struttura_corrente_quinta",
              "def _inizializza_luce_persa_quinta",
              "_intermezzo_cariche",
              "_festante_fantasmi",
              "Rosso D'ossidina",
              "Obscurio",
          ]
          for token in richiesti:
              assert token in text, token
          print("runtime hooks OK")
          PY
          git diff --check
      - name: Commit final changes
        run: |
          rm apply_quinta_ondata.py .github/workflows/apply_quinta_ondata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge tredici nuovi set"
          git push origin feature/set-eroi-tempesta
