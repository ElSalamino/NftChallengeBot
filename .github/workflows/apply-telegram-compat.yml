name: Apply Telegram compatibility fixes

on:
  push:
    branches:
      - feature/set-eroi-tempesta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Patch Telegram/Pyrogram compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('__init__.py')
          text = path.read_text(encoding='utf-8')
          original = text
          changes = []

          def replace_exact(old, new, label, expected=1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: attese {expected} occorrenze, trovate {count}')
              text = text.replace(old, new)
              changes.append(f'{label}: {count}')

          # Pyrogram 2.x: ban_chat_member sostituisce il vecchio kick_chat_member.
          if 'from datetime import datetime, timedelta' not in text:
              marker = 'from io import BytesIO, StringIO\n'
              if marker not in text:
                  raise SystemExit('Import marker non trovato')
              text = text.replace(marker, marker + 'from datetime import datetime, timedelta\n', 1)
              changes.append('import datetime/timedelta: 1')

          old_ban = '''@app.on_message(filters.command("ban") & filters.user(autorizzati)\n)\ndef reset(client, message):\n    if len(message.command) == 1:\n        app.kick_chat_member(message.chat.id,message.reply_to_message.from_user.id)\n        app.send_message(message.chat.id,f"{message.reply_to_message.from_user.username} bannato per seeeempre!")\n    else:\n        app.kick_chat_member(message.chat.id,message.reply_to_message.from_user.id, int(time.time() + int(message.command[1])))\n        app.send_message(message.chat.id,f"{message.reply_to_message.from_user.username} bannato per un pochino di secondi, tipo {message.command[1]}!")\n'''
          new_ban = '''@app.on_message(filters.command("ban") & filters.user(autorizzati)\n)\ndef reset(client, message):\n    if not message.reply_to_message:\n        app.send_message(message.chat.id, "Usa /ban in risposta alla persona da bannare!")\n        return\n    if len(message.command) == 1:\n        app.ban_chat_member(message.chat.id, message.reply_to_message.from_user.id)\n        app.send_message(message.chat.id, f"{message.reply_to_message.from_user.username} bannato per seeeempre!")\n    else:\n        try:\n            secondi = max(30, int(message.command[1]))\n        except (TypeError, ValueError):\n            app.send_message(message.chat.id, "Durata non valida. Usa /ban secondi rispondendo alla persona.")\n            return\n        app.ban_chat_member(\n            message.chat.id,\n            message.reply_to_message.from_user.id,\n            datetime.now() + timedelta(seconds=secondi),\n        )\n        app.send_message(message.chat.id, f"{message.reply_to_message.from_user.username} bannato per {secondi} secondi!")\n'''
          replace_exact(old_ban, new_ban, '/ban Pyrogram 2')

          old_kick = '''@app.on_message(filters.command("kick") & filters.user(autorizzati)\n)\ndef reset(client, message):\n    app.kick_chat_member(message.chat.id,message.reply_to_message.from_user.id, int(time.time() + 30))\n    app.send_message(message.chat.id,f"{message.reply_to_message.from_user.username} cacciato via dal gruppo!")\n'''
          new_kick = '''@app.on_message(filters.command("kick") & filters.user(autorizzati)\n)\ndef reset(client, message):\n    if not message.reply_to_message:\n        app.send_message(message.chat.id, "Usa /kick in risposta alla persona da cacciare!")\n        return\n    user_id = message.reply_to_message.from_user.id\n    app.ban_chat_member(message.chat.id, user_id)\n    app.unban_chat_member(message.chat.id, user_id)\n    app.send_message(message.chat.id, f"{message.reply_to_message.from_user.username} cacciato via dal gruppo!")\n'''
          replace_exact(old_kick, new_kick, '/kick Pyrogram 2')

          replace_exact(
              'app.unban_chat_member(message.chat.id, message.reply_to_message.from_user.username)',
              'app.unban_chat_member(message.chat.id, message.reply_to_message.from_user.id)',
              '/sban usa user id',
          )

          # Client.delete non esiste: usa delete_messages con message_ids.
          arena_delete_pattern = re.compile(
              r'''await client\.delete\(\s*chat_id=message\.chat\.id,\s*reply_to_message_id=player\[username\]\["arena"\]\["pin"\]\s*\)''',
              re.MULTILINE,
          )
          text, count = arena_delete_pattern.subn(
              '''await client.delete_messages(\n                    chat_id=message.chat.id,\n                    message_ids=player[username]["arena"]["pin"]\n                )''',
              text,
          )
          if count != 1:
              raise SystemExit(f'/arena delete: attesa 1 occorrenza, trovate {count}')
          changes.append('/arena delete_messages: 1')

          # Corregge la precedenza di | e &: i filtri comuni valgono sia per pulsante sia per comando.
          replace_exact(
              '@app.on_message(filters.regex(r"^Top 🔝")|filters.command(["top", "top@NFTchallengebot"]) & ~filters.user(bannati) & ~filters.chat(non_qui)\n)',
              '@app.on_message((filters.regex(r"^Top 🔝") | filters.command(["top", "top@NFTchallengebot"])) & ~filters.user(bannati) & ~filters.chat(non_qui))',
              'filtro /top',
          )
          replace_exact(
              '@app.on_message( ~filters.user(bannati) & filters.regex(r"^Me 👤")| filters.command(["me", "me@NFTchallengebot"]))',
              '@app.on_message(~filters.user(bannati) & (filters.regex(r"^Me 👤") | filters.command(["me", "me@NFTchallengebot"])))',
              'filtro /me',
          )
          replace_exact(
              '@app.on_message( ~filters.user(bannati) & filters.regex(r"^Info 🗞")|filters.command(["info"]))',
              '@app.on_message(~filters.user(bannati) & (filters.regex(r"^Info 🗞") | filters.command(["info"])))',
              'filtro /info',
          )
          replace_exact(
              '@app.on_message(filters.regex(r"^Invita 📮")|filters.command(["invita", "invita@NFTchallengebot"]) & ~filters.user(bannati)\n)',
              '@app.on_message((filters.regex(r"^Invita 📮") | filters.command(["invita", "invita@NFTchallengebot"])) & ~filters.user(bannati))',
              'filtro /invita',
          )

          # Regex callback: * e ? erano metacaratteri, non separatori letterali.
          replace_exact('filters.regex("suggerisci*")', 'filters.regex(r"^suggerisci\\*")', 'callback suggerisci')
          replace_exact('filters.regex("approzzi*")', 'filters.regex(r"^approzzi\\*")', 'callback approzzi')
          replace_exact('filters.regex("nomina?")', 'filters.regex(r"^nomina\\?")', 'callback nomina')

          # /duello senza reply e senza username non deve generare IndexError.
          old_duello = '''async def duello(client, message):\n    if message.reply_to_message == None:\n                    to = message.command[1].replace("@", "")'''
          new_duello = '''async def duello(client, message):\n    if message.reply_to_message is None and len(message.command) < 2:\n        await message.reply("Usa /duello @utente oppure rispondi a un messaggio.")\n        return\n    if message.reply_to_message == None:\n                    to = message.command[1].replace("@", "")'''
          replace_exact(old_duello, new_duello, 'guardia /duello')

          # Fallback ACK in un gruppo successivo: evita spinner Telegram sui callback
          # che non rispondono esplicitamente; eventuali doppi answer sono ignorati.
          ack_block = '''\n\n@app.on_callback_query(group=999)\nasync def _ack_callback_query(client, query):\n    try:\n        await query.answer()\n    except Exception:\n        pass\n'''
          if '_ack_callback_query' not in text:
              marker = '\n\ngc.collect()\nsched.start()\n'
              if marker not in text:
                  raise SystemExit('Marker finale per callback ACK non trovato')
              text = text.replace(marker, ack_block + marker, 1)
              changes.append('fallback callback answer: 1')

          # Verifiche testuali di regressione.
          forbidden = [
              'kick_chat_member(',
              'await client.delete(',
              'filters.regex("suggerisci*")',
              'filters.regex("approzzi*")',
              'filters.regex("nomina?")',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Residuo incompatibile trovato: {token}')

          if text == original:
              raise SystemExit('Nessuna modifica applicata')

          path.write_text(text, encoding='utf-8')
          print('\n'.join(changes))
          PY

      - name: Show focused diff
        run: git diff --check && git diff -- __init__.py

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-telegram-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __init__.py .github/workflows/apply-telegram-compat.yml
          git commit -m "Aggiorna compatibilità Telegram e Pyrogram"
          git push origin HEAD:feature/set-eroi-tempesta
