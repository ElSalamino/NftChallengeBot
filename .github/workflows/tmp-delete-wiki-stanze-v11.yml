name: Cleanup ramo Wiki stanze v11

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-delete-wiki-stanze-v11.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina ramo temporaneo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/wiki-stanze-v11"
