name: Audit completo set

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0
      - name: Analizza tutti i set
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def literal_assignment(path, name):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for t in node.targets:
                          if isinstance(t, ast.Name) and t.id == name:
                              return ast.literal_eval(node.value)
              raise RuntimeError(f'{name} non trovato in {path}')

          classi = literal_assignment('liste.py', 'classi')
          proc = literal_assignment('bilanciamento.py', 'PROC_CLASSI')
          nft_text = Path('nft.py').read_text(encoding='utf-8')
          lines = nft_text.splitlines()
          tree = ast.parse(nft_text)

          class_names = set(classi)
          missing = sorted(class_names - set(proc), key=str.lower)
          extra = sorted(set(proc) - class_names, key=str.lower)

          occurrences = {name: [] for name in class_names}
          for node in ast.walk(tree):
              if isinstance(node, ast.Constant) and isinstance(node.value, str) and node.value in class_names:
                  occurrences[node.value].append(node.lineno)

          out = []
          out.append(f'TOTALE SET liste.classi: {len(class_names)}')
          out.append(f'TOTALE SET PROC_CLASSI: {len(proc)}')
          out.append(f'SET SENZA CONFIG: {len(missing)}')
          out.append('')
          for name in missing:
              out.append(f'- {name} | occorrenze nft.py: {sorted(set(occurrences[name]))}')
          out.append('')
          out.append(f'CONFIG SENZA SET IN liste.classi: {len(extra)}')
          for name in extra:
              out.append(f'- {name}')

          out.append('\n' + '='*100)
          out.append('CONTESTI DEI SET SENZA CONFIG')
          out.append('='*100)
          for name in missing:
              out.append('\n' + '#' * 90)
              out.append(name)
              out.append('#' * 90)
              hits = sorted(set(occurrences[name]))
              if not hits:
                  out.append('NESSUNA OCCORRENZA IN nft.py')
                  continue
              last_end = -1
              for line_no in hits:
                  start = max(1, line_no - 8)
                  end = min(len(lines), line_no + 16)
                  if start <= last_end:
                      continue
                  last_end = end
                  out.append(f'--- riga {line_no} ---')
                  for n in range(start, end + 1):
                      out.append(f'{n:05d}: {lines[n-1]}')

          Path('audit_set_completo.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit report e pulizia
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_set_completo.txt
          git rm .github/workflows/audit-tutti-set.yml
          git commit -m "chore: audit completo set"
          git push origin HEAD:refactor/bilanciamento-config
