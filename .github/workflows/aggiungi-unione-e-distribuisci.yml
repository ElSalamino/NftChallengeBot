name: Aggiungi Unione dello spirito e distribuisci anelli

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - 'tools/aggiungi_unione_e_distribuisci.py'
      - '.github/workflows/aggiungi-unione-e-distribuisci.yml'

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Applica aggiornamento
        run: python tools/aggiungi_unione_e_distribuisci.py

      - name: Compila file Python modificati
        run: python -m py_compile bilanciamento.py frasi_incantesimi.py liste.py nft.py

      - name: Commit finale e pulizia file temporanei
        run: |
          git config user.name "ElSalamino"
          git config user.email "86099774+ElSalamino@users.noreply.github.com"
          git rm tools/aggiungi_unione_e_distribuisci.py .github/workflows/aggiungi-unione-e-distribuisci.yml
          git add bilanciamento.py frasi_incantesimi.py liste.py nft.py
          git commit -m "feat: aggiungi Unione dello spirito e distribuisci nuovi anelli"
          git push origin refactor/bilanciamento-config
