name: Audit assalto

on:
  push:
    branches:
      - refactor/bilanciamento-config
    paths:
      - '.github/workflows/audit-assalto.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Stampa censimento assalto
        run: |
          python - <<'PY'
          import re
          import pprint
          import bilanciamento
          import liste
          from pathlib import Path

          print('=== SET CON CONFIG ASSALTO ===')
          for nome, cfg in bilanciamento.PROC_CLASSI.items():
              if isinstance(cfg, dict) and 'assalto' in cfg:
                  print(nome, '=>', pprint.pformat(cfg['assalto'], sort_dicts=False, width=180))

          print('\n=== ANELLI CON CONFIG ASSALTO ===')
          for nome, cfg in bilanciamento.PROC_ANELLI.items():
              if isinstance(cfg, dict) and 'assalto' in cfg:
                  print(nome, '=>', pprint.pformat(cfg['assalto'], sort_dicts=False, width=180))

          print('\n=== INCANTESIMI CON CONFIG ASSALTO ===')
          for nome, cfg in bilanciamento.INCANTESIMI_CONFIG.items():
              if isinstance(cfg, dict) and 'assalto' in cfg:
                  print(nome, '=>', pprint.pformat(cfg['assalto'], sort_dicts=False, width=180))

          print('\n=== EFFETTI TEMPORANEI ===')
          pprint.pp(bilanciamento.EFFETTI_CONFIG, sort_dicts=False, width=180)

          print('\n=== NUCLEI ===')
          pprint.pp(liste.nuclei, width=180)

          src = Path('nft.py').read_text(encoding='utf-8')
          assedio = src.split('def assedio(',1)[1].split('async def dungeon_boss',1)[0]
          riassalto = src.split('async def riassalto(',1)[1].split('async def muoveeere',1)[0]
          blocco = assedio + '\n' + riassalto

          nomi = set()
          patterns = [
              r'\bset\s*==\s*[\'\"]([^\'\"]+)[\'\"]',
              r'\bset\s*==\s*\"([^\"]+)\"',
              r'giocatore\[\"set\"\]\s*==\s*[\'\"]([^\'\"]+)[\'\"]',
              r'playerg\[[^\]]+\]\[\"scheda\"\]\[\"set\"\]\s*==\s*[\'\"]([^\'\"]+)[\'\"]',
          ]
          for pat in patterns:
              nomi.update(re.findall(pat, blocco))
          print('\n=== SET CITATI NEL FLOW ASSALTO (REGEX) ===')
          for nome in sorted(nomi):
              print(nome)

          print('\n=== CONTEGGI ===')
          print('set config assalto:', sum(1 for c in bilanciamento.PROC_CLASSI.values() if isinstance(c,dict) and 'assalto' in c))
          print('anelli config assalto:', sum(1 for c in bilanciamento.PROC_ANELLI.values() if isinstance(c,dict) and 'assalto' in c))
          print('incantesimi config assalto:', sum(1 for c in bilanciamento.INCANTESIMI_CONFIG.values() if isinstance(c,dict) and 'assalto' in c))
          print('set citati flow:', len(nomi))
          PY

      - name: Pulisci workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/audit-assalto.yml
          git commit -m "chore: rimuovi audit temporaneo assalto"
          git push origin refactor/bilanciamento-config
