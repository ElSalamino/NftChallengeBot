name: Applica set Eroi della tempesta

on:
  push:
    branches:
      - feature/set-eroi-tempesta

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Applica meccaniche e catalogo
        shell: bash
        run: |
          cat > /tmp/applica.py <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def append_once(path, marker, block):
              text = read(path)
              if marker not in text:
                  text = text.rstrip() + "\n\n" + block.strip() + "\n"
                  write(path, text)

          # ---------------- liste.py ----------------
          p = "liste.py"
          text = read(p)
          text = text.replace("Nucleo della tempesta", "Origine della tempesta")
          text = text.replace("Magia antica 💫", "Eroi di altrove 💫")
          write(p, text)

          append_once(p, "# --- SET EROI DELLA TEMPESTA: CATALOGO ---", r'''
          # --- SET EROI DELLA TEMPESTA: CATALOGO ---
          classi.update({
              "Guerriero Temporale": ["Centro temporale", "Assetto mecha"],
              "Dannato primordiale": ["Benda maledetta", "Il ciondolo della creazione"],
              "Macellatore": ["Armatura di carne", "Anima dispersa"],
              "Mente centrale": ["Zanna del aliena", "Benda maledetta"],
              "Amletico": ["Origine della tempesta", "Corona maledetta"],
              "Accumulatore di meraviglie": ["Una valigia senza fine", "Il ciondolo della creazione"],
              "Anima della festa": ["Staffa da rave", "Centro temporale"],
              "Zanno": ["Zanna maledetta", "Zanna del aliena"],
              "Uditore del profondo": ["Tentacolo viscido", "Armatura di carne"],
              "Monarca della tempesta di fuoco": ["Un copricapo rossastro", "Anima dispersa"],
              "Evocatore delle maree": ["Il ciondolo della creazione", "Chela animata"],
              "Mecha sciamano": ["Stecca tori", "Assetto mecha"],
          })

          Approccini.update({
              "Guerriero Temporale": ["Difensivo", "Schivo", "Impavido"],
              "Dannato primordiale": ["Aggressivo", "Rabbioso", "Spinto"],
              "Macellatore": ["Conservativo", "Difensivo", "Spinto"],
              "Mente centrale": ["Aggressivo", "Spavaldo", "Rischioso"],
              "Amletico": ["Conservativo", "Spinto", "Malevolo"],
              "Accumulatore di meraviglie": ["Spinto", "Autorevole", "Conservativo"],
              "Anima della festa": ["Aggressivo", "Agile", "Spinto"],
              "Zanno": ["Rabbioso", "Aggressivo", "Spavaldo"],
              "Uditore del profondo": ["Conservativo", "Difensivo", "Rischioso"],
              "Monarca della tempesta di fuoco": ["Difensivo", "Conservativo", "Impavido"],
              "Evocatore delle maree": ["Aggressivo", "Rabbioso", "Spavaldo"],
              "Mecha sciamano": ["Difensivo", "Impavido", "Spinto"],
          })

          bonus.update({
              "Guerriero Temporale": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Dannato primordiale": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Macellatore": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Mente centrale": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Amletico": {"hp": 50, "def": 0, "atk": 0, "agi": 0},
              "Accumulatore di meraviglie": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Anima della festa": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Zanno": {"hp": 0, "def": 0, "atk": 300, "agi": 0},
              "Uditore del profondo": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Monarca della tempesta di fuoco": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Evocatore delle maree": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
              "Mecha sciamano": {"hp": 0, "def": 0, "atk": 0, "agi": 0},
          })

          frasi_set.update({
              "Guerriero Temporale": "Il tempo non ti lascia morire facilmente: in sfida combatti con soli 100 HP, ma puoi tornare in piedi fino a cinque volte.",
              "Dannato primordiale": "Il male divora ogni difesa: in sfida e in assalto tutta la DEF viene convertita in ATK.",
              "Macellatore": "Una schivata non basta a scappare: in sfida puoi riacciuffare chi evita il colpo e punirlo al doppio.",
              "Mente centrale": "Sei non ironicamente diventato la mente centrale di una razza aliena: durante gli assalti gli alieni possono colpire ogni struttura attraversata.",
              "Amletico": "Potere o sopravvivenza? In sfida e in assalto puoi sacrificare metà della vita per trasformarla in attacco. Hai inoltre 50 HP extra.",
              "Accumulatore di meraviglie": "Una valigia infinita risolve qualsiasi problema, dal vaso alla Luna: ogni turno può comparire qualcosa che altera il colpo.",
              "Anima della festa": "La festa cresce turno dopo turno: recuperi seguaci che aumentano tutte le statistiche e in assalto sfrutti meglio chi ti ha preceduto.",
              "Zanno": "Zanne. Tante zanne. Soprattutto +300 ATK.",
              "Uditore del profondo": "A un solo punto vita qualcosa dal profondo risponde. E risponde con un miliardo di danni.",
              "Monarca della tempesta di fuoco": "In sfida combatti come se avessi sempre Iridescente, Minimista, Primo impatto e Icore.",
              "Evocatore delle maree": "Ogni assalto richiama Onde dell'abisso; se cadi, il tuo impatto genera uno tsunami contro tutte le strutture.",
              "Mecha sciamano": "In sfida il mecha consuma 10 HP a turno e forza nuovamente il tuo approccio, esasperandone le statistiche.",
          })

          def set_per_oggetto(nome_oggetto):
              """Restituisce tutti i set che richiedono l'oggetto, ignorando l'eventuale livello LV."""
              base = str(nome_oggetto).split(" LV")[0]
              trovati = []
              for nome_set, componenti in classi.items():
                  if not nome_set or not componenti:
                      continue
                  if base in componenti:
                      trovati.append(nome_set)
              return sorted(trovati, key=str.lower)
          ''')

          # ---------------- bilanciamento.py ----------------
          append_once("bilanciamento.py", "# --- SET EROI DELLA TEMPESTA: BILANCIAMENTO ---", r'''
          # --- SET EROI DELLA TEMPESTA: BILANCIAMENTO ---
          PROC_CLASSI.update({
              "Guerriero Temporale": {
                  "sfida": {"ciclo_temporale": {"hp": 100, "resurrezioni": 5}},
              },
              "Dannato primordiale": {
                  "sfida": {"conversione": {"proc": 100}},
                  "assalto": {"conversione": {"proc": 100}},
              },
              "Macellatore": {
                  "sfida": {"presa_schivata": {"proc": 50, "moltiplicatore_danno": 2}},
              },
              "Mente centrale": {
                  "assalto": {"alieno": {"proc": 50, "divisore_atk": 20}},
              },
              "Amletico": {
                  "sfida": {"sacrificio": {"proc": 50, "percento_hp": 50}},
                  "assalto": {"sacrificio": {"proc": 50, "percento_hp": 50}},
              },
              "Accumulatore di meraviglie": {
                  "sfida": {
                      "evocazione": {
                          "proc": 50,
                          "oggetti": {
                              "Un vaso": 5,
                              "Un sasso di medie dimensioni": 10,
                              "Un idropulitrice": 15,
                              "cento fiammiferi": 20,
                              "una mustang": 30,
                              "Sei cammelli": 40,
                              "LA LUNA": 100,
                          },
                      }
                  },
              },
              "Anima della festa": {
                  "sfida": {"seguaci": {"seguaci_per_turno": 1, "percento_stat_per_seguace": 2}},
                  "assalto": {"last": {"moltiplicatore": 1.5}},
              },
              "Zanno": {
                  "generale": {"set_base": {"solo_bonus_base": True}},
              },
              "Uditore del profondo": {
                  "sfida": {"richiamo": {"hp_trigger": 1, "danno": 1000000000}},
                  "assalto": {"richiamo": {"hp_trigger": 1, "danno": 1000000000}},
              },
              "Monarca della tempesta di fuoco": {
                  "sfida": {"incantamenti": {"nomi": ["Iridescente", "Minimista", "Primo impatto", "Icore"]}},
              },
              "Evocatore delle maree": {
                  "assalto": {
                      "onda": {"incantesimo": "Onde dell'abisso"},
                      "tsunami": {"percento_atk": 10},
                  },
              },
              "Mecha sciamano": {
                  "sfida": {"riuso_approccio": {"danno_hp": 10}},
              },
          })
          ''')

          # ---------------- frasi_set.py ----------------
          append_once("frasi_set.py", "# --- SET EROI DELLA TEMPESTA: FRASI TECNICHE ---", r'''
          # --- SET EROI DELLA TEMPESTA: FRASI TECNICHE ---
          FRASI_SET_TECNICHE.update({
              "Guerriero Temporale": "Sfida: HP fissati a {sfida.ciclo_temporale.hp}; fino a {sfida.ciclo_temporale.resurrezioni} resurrezioni, ciascuna di nuovo a 100 HP. Assalto: nessun effetto.",
              "Dannato primordiale": "Sfida/Assalto: converte il 100% della DEF posseduta in ATK e porta la DEF a 0.",
              "Macellatore": "Sfida: quando l'avversario schiva, {sfida.presa_schivata.proc:pct} di riacciuffarlo e infliggere {sfida.presa_schivata.moltiplicatore_danno:x} il danno normale. Assalto: nessun effetto.",
              "Mente centrale": "Assalto: per ogni struttura attraversata, {assalto.alieno.proc:pct} che un alieno infligga ATK/{assalto.alieno.divisore_atk}. Sfida: nessun effetto.",
              "Amletico": "Bonus base: +50 HP. Sfida/Assalto: {sfida.sacrificio.proc:pct} per sacrificare il {sfida.sacrificio.percento_hp:pct} degli HP correnti e aggiungerlo all'ATK del colpo.",
              "Accumulatore di meraviglie": "Sfida: ogni turno {sfida.evocazione.proc:pct} di evocare un oggetto. Il valore dell'oggetto aumenta il danno del proprio colpo o riduce quello nemico; gli oggetti di valore alto sono più rari.",
              "Anima della festa": "Sfida: +1 seguace per turno e +{sfida.seguaci.percento_stat_per_seguace:pct} HP/ATK/DEF/AGI per ogni seguace. Assalto: il contributo degli aiutanti recenti è moltiplicato per {assalto.last.moltiplicatore:x}.",
              "Zanno": "Bonus base permanente del set: +300 ATK.",
              "Uditore del profondo": "Sfida/Assalto: entrando esattamente a {sfida.richiamo.hp_trigger} HP infligge {sfida.richiamo.danno} danni al bersaglio.",
              "Monarca della tempesta di fuoco": "Sfida: possiede sempre Iridescente, Minimista, Primo impatto e Icore come incantamenti innati. Assalto: nessun effetto.",
              "Evocatore delle maree": "Assalto: attiva sempre Onde dell'abisso; alla morte infligge a tutte le strutture il {assalto.tsunami.percento_atk:pct} del proprio ATK. Sfida: nessun effetto.",
              "Mecha sciamano": "Sfida: perde {sfida.riuso_approccio.danno_hp} HP a ogni proprio turno e riapplica il moltiplicatore dell'approccio. Assalto: nessun effetto.",
          })
          ''')

          # ---------------- nft.py: agganci interni assalto ----------------
          p = "nft.py"
          text = read(p)

          if "# Mente centrale: alieno per struttura attraversata." not in text:
              needle = '    for difesa in order:\n        \n        if difesa in nemico:\n'
              if needle not in text:
                  raise RuntimeError("Anchor Mente centrale non trovato")
              insert = needle + '''            # Mente centrale: alieno per struttura attraversata.\n            if set == "Mente centrale" and proc_ok(random.random(), set, "assalto", "alieno"):\n                danno_alieno = round(player["atk"] / proc_val(set, "assalto", "alieno", "divisore_atk"))\n                nemico[difesa]["hp"] -= danno_alieno\n                player["fatto"] += danno_alieno\n                text += f"👽 Un alieno della mente centrale colpisce {difesa} per {danno_alieno} danni!\\n"\n'''
              text = text.replace(needle, insert, 1)

          if "# Amletico: sacrificio vita per il singolo colpo d'assalto." not in text:
              needle = '''            else:\n                defense = player["def"]\n                dps = player["atk"]\n                agi = player["agi"]\n'''
              if needle not in text:
                  raise RuntimeError("Anchor Amletico assalto non trovato")
              insert = '''            else:\n                defense = player["def"]\n                dps = player["atk"]\n                # Amletico: sacrificio vita per il singolo colpo d'assalto.\n                if set == "Amletico" and proc_ok(random.random(), set, "assalto", "sacrificio"):\n                    costo_amletico = max(1, round(max(0, player["hp"]) * proc_val(set, "assalto", "sacrificio", "percento_hp") / 100))\n                    player["hp"] -= costo_amletico\n                    dps += costo_amletico\n                    text += f"🎭 {nome} sacrifica {costo_amletico} HP e li trasforma in attacco!\\n"\n                agi = player["agi"]\n'''
              text = text.replace(needle, insert, 1)

          if "# Anima della festa potenzia solo il contributo di last." not in text:
              needle = '                                    serv = matx\n'
              if needle not in text:
                  raise RuntimeError("Anchor Anima della festa non trovato")
              insert = '''                                    serv = matx\n                                    # Anima della festa potenzia solo il contributo di last.\n                                    if giocatore.get("set") == "Anima della festa":\n                                        serv *= proc_val("Anima della festa", "assalto", "last", "moltiplicatore")\n'''
              text = text.replace(needle, insert, 1)

          write(p, text)

          append_once(p, "# --- SET EROI DELLA TEMPESTA: RUNTIME ---", r'''
          # --- SET EROI DELLA TEMPESTA: RUNTIME ---
          _turno_eroi_base = turno
          _assedio_eroi_base = assedio

          def _nomi_pve_conosciuti():
              nomi = set()
              for raccolta in (Boss, nemici, Nautici):
                  try:
                      valori = raccolta.values()
                  except Exception:
                      continue
                  for dati in valori:
                      if isinstance(dati, dict) and dati.get("Nome"):
                          nomi.add(dati["Nome"])
              return nomi

          def _e_sfida_pvp(main, oppo, cond):
              # I flussi PvP principali passano sempre un cond (anche stringa vuota).
              # Il fallback sui nomi copre le amichevoli storiche che chiamano turno() senza cond.
              if cond is not None:
                  return True
              pve = _nomi_pve_conosciuti()
              return main.get("Nome") not in pve and oppo.get("Nome") not in pve

          def _prepara_set_pvp(personaggio):
              text = ""
              nome_set = personaggio.get("set")

              if nome_set == "Guerriero Temporale":
                  cfg = proc_cfg(nome_set, "sfida", "ciclo_temporale")
                  if not personaggio.get("_temporale_inizializzato"):
                      personaggio["hp"] = cfg["hp"]
                      personaggio["_temporale_resurrezioni"] = 0
                      personaggio["_temporale_inizializzato"] = True
                      text += f"⏳ {personaggio['Nome']} entra nel ciclo temporale con {cfg['hp']} HP!\\n"
                  elif personaggio["hp"] > cfg["hp"]:
                      personaggio["hp"] = cfg["hp"]

              if nome_set == "Dannato primordiale" and not personaggio.get("_dannato_conversione"):
                  difesa = personaggio.get("def", 0)
                  personaggio["atk"] += difesa
                  personaggio["def"] = 0
                  personaggio["_dannato_conversione"] = True
                  text += f"😈 {personaggio['Nome']} converte {difesa} DEF in ATK!\\n"

              if nome_set == "Monarca della tempesta di fuoco":
                  innati = proc_val(nome_set, "sfida", "incantamenti", "nomi", [])
                  incantamenti = personaggio.setdefault("incantamenti", [])
                  for incantesimo in innati:
                      if incantesimo not in incantamenti:
                          incantamenti.append(incantesimo)

              return text

          def _resurrezione_temporale(personaggio):
              if personaggio.get("set") != "Guerriero Temporale" or personaggio.get("hp", 0) > 0:
                  return ""
              cfg = proc_cfg("Guerriero Temporale", "sfida", "ciclo_temporale")
              usate = personaggio.get("_temporale_resurrezioni", 0)
              if usate >= cfg["resurrezioni"]:
                  return ""
              usate += 1
              personaggio["_temporale_resurrezioni"] = usate
              personaggio["hp"] = cfg["hp"]
              return f"⏳ {personaggio['Nome']} riavvolge il tempo e rivive! ({usate}/{cfg['resurrezioni']})\\n"

          def _oggetto_accumulatore():
              oggetti = proc_val("Accumulatore di meraviglie", "sfida", "evocazione", "oggetti", {})
              nomi = list(oggetti)
              pesi = [1 / max(1, oggetti[nome]) for nome in nomi]
              scelto = random.choices(nomi, weights=pesi, k=1)[0]
              return scelto, oggetti[scelto]

          def _danno_normale_macellatore(main, oppo):
              dps = max(0, float(main.get("atk", 0)))
              difesa = max(0, float(oppo.get("def", 0)))
              minimo = dps * (100 / ((100 + difesa * 1.5) + 1))
              massimo = dps * (100 / ((100 + difesa) + 1))
              danno = random.uniform(minimo, massimo)
              return max(20, danno)

          def turno(main, oppo, cond=None):
              if not _e_sfida_pvp(main, oppo, cond):
                  return _turno_eroi_base(main, oppo, cond)

              prefisso = _prepara_set_pvp(main) + _prepara_set_pvp(oppo)

              # Il Guerriero Temporale non può mai conservare cure oltre il proprio tetto di 100 HP.
              for combattente in (main, oppo):
                  if combattente.get("set") == "Guerriero Temporale":
                      combattente["hp"] = min(combattente["hp"], proc_val("Guerriero Temporale", "sfida", "ciclo_temporale", "hp"))

              # Anima della festa recupera un seguace a ogni proprio turno.
              if main.get("set") == "Anima della festa":
                  cfg = proc_cfg("Anima della festa", "sfida", "seguaci")
                  if "_anima_festa_base" not in main:
                      main["_anima_festa_base"] = {stat: main.get(stat, 0) for stat in ("hp", "atk", "def", "agi")}
                  main["_anima_festa_seguaci"] = main.get("_anima_festa_seguaci", 0) + cfg["seguaci_per_turno"]
                  for stat in ("hp", "atk", "def", "agi"):
                      main[stat] += main["_anima_festa_base"][stat] * cfg["percento_stat_per_seguace"] / 100
                  prefisso += f"🎉 {main['Nome']} recupera un seguace! ({main['_anima_festa_seguaci']} seguaci)\\n"

              # Mecha sciamano: costo fisso e nuovo passaggio sul moltiplicatore dell'approccio.
              if main.get("set") == "Mecha sciamano":
                  costo = proc_val("Mecha sciamano", "sfida", "riuso_approccio", "danno_hp")
                  main["hp"] -= costo
                  try:
                      boost(main, Approcci)
                  except Exception:
                      pass
                  prefisso += f"🤖 {main['Nome']} perde {costo} HP e riusa {main.get('Ap', 'Base')}!\\n"

              # Amletico: il bonus ATK vale solo per questo attacco.
              bonus_amletico = 0
              if main.get("set") == "Amletico" and proc_ok(random.random(), "Amletico", "sfida", "sacrificio"):
                  pct = proc_val("Amletico", "sfida", "sacrificio", "percento_hp")
                  bonus_amletico = max(1, round(max(0, main["hp"]) * pct / 100))
                  main["hp"] -= bonus_amletico
                  main["atk"] += bonus_amletico
                  prefisso += f"🎭 {main['Nome']} sacrifica {bonus_amletico} HP e li aggiunge al proprio ATK!\\n"

              # Accumulatore: ogni possessore tira indipendentemente nel turno in cui attacca/difende.
              oggetto_attacco = None
              oggetto_difesa = None
              if main.get("set") == "Accumulatore di meraviglie" and proc_ok(random.random(), "Accumulatore di meraviglie", "sfida", "evocazione"):
                  oggetto_attacco = _oggetto_accumulatore()
              if oppo.get("set") == "Accumulatore di meraviglie" and proc_ok(random.random(), "Accumulatore di meraviglie", "sfida", "evocazione"):
                  oggetto_difesa = _oggetto_accumulatore()

              hp_oppo_prima = oppo.get("hp", 0)
              testo = _turno_eroi_base(main, oppo, cond)

              if bonus_amletico:
                  main["atk"] -= bonus_amletico

              danno_corrente = max(0, hp_oppo_prima - oppo.get("hp", 0))
              if oggetto_attacco is not None:
                  nome_oggetto, valore = oggetto_attacco
                  if danno_corrente > 0:
                      oppo["hp"] -= valore
                      main["fatto"] = main.get("fatto", 0) + valore
                      testo += f"🧳 Il tuo colpo è potenziato da {nome_oggetto}: +{valore} danni!\\n"
                  else:
                      testo += f"🧳 {nome_oggetto} esce dalla valigia, ma il colpo non arriva a segno.\\n"

              if oggetto_difesa is not None:
                  nome_oggetto, valore = oggetto_difesa
                  danno_totale = max(0, hp_oppo_prima - oppo.get("hp", 0))
                  ridotto = min(valore, danno_totale)
                  if ridotto > 0:
                      oppo["hp"] += ridotto
                      main["fatto"] = max(0, main.get("fatto", 0) - ridotto)
                      testo += f"🧳 Il colpo nemico è ridotto grazie all'uso di {nome_oggetto}: -{ridotto} danni!\\n"
                  else:
                      testo += f"🧳 {nome_oggetto} viene evocato, ma non c'è danno da ridurre.\\n"

              # Macellatore punisce una schivata appena risolta.
              if main.get("set") == "Macellatore" and oppo.get("schivato") is True and proc_ok(random.random(), "Macellatore", "sfida", "presa_schivata"):
                  mol = proc_val("Macellatore", "sfida", "presa_schivata", "moltiplicatore_danno")
                  danno = round(_danno_normale_macellatore(main, oppo) * mol)
                  oppo["hp"] -= danno
                  main["fatto"] = main.get("fatto", 0) + danno
                  testo += f"🪝 {main['Nome']} riacciuffa {oppo['Nome']} dopo la schivata e infligge {danno} danni!\\n"

              # Uditore del profondo scatta ogni volta che si entra esattamente a 1 HP.
              trigger = []
              for proprietario, bersaglio in ((main, oppo), (oppo, main)):
                  if proprietario.get("hp") != 1:
                      proprietario["_uditore_a_uno"] = False
                  if proprietario.get("set") == "Uditore del profondo" and proprietario.get("hp") == 1 and not proprietario.get("_uditore_a_uno"):
                      proprietario["_uditore_a_uno"] = True
                      trigger.append((proprietario, bersaglio))
              for proprietario, bersaglio in trigger:
                  danno = proc_val("Uditore del profondo", "sfida", "richiamo", "danno")
                  bersaglio["hp"] -= danno
                  proprietario["fatto"] = proprietario.get("fatto", 0) + danno
                  testo += f"🌊 Il profondo risponde a {proprietario['Nome']}: {danno} danni a {bersaglio['Nome']}!\\n"

              # Le resurrezioni temporali si risolvono prima che il loop esterno controlli is_dead().
              testo += _resurrezione_temporale(main)
              testo += _resurrezione_temporale(oppo)
              for combattente in (main, oppo):
                  if combattente.get("set") == "Guerriero Temporale" and combattente.get("hp", 0) > 0:
                      combattente["hp"] = min(combattente["hp"], proc_val("Guerriero Temporale", "sfida", "ciclo_temporale", "hp"))

              return prefisso + testo

          def assedio(playerg, player, nemico, target, team, order, clan, meteo=None, setting=dict()):
              nome_set = player.get("set")
              prefisso = ""

              if nome_set == "Dannato primordiale" and not player.get("_dannato_conversione"):
                  difesa = player.get("def", 0)
                  player["atk"] += difesa
                  player["def"] = 0
                  player["_dannato_conversione"] = True
                  prefisso += f"😈 {player['Nome']} converte {difesa} DEF in ATK prima dell'assalto!\\n"

              if nome_set == "Evocatore delle maree":
                  incantesimo = proc_val(nome_set, "assalto", "onda", "incantesimo")
                  incantamenti = player.setdefault("incantamenti", [])
                  if incantesimo not in incantamenti:
                      incantamenti.append(incantesimo)

              testo = _assedio_eroi_base(playerg, player, nemico, target, team, order, clan, meteo, setting)

              if nome_set == "Uditore del profondo" and player.get("hp") == proc_val(nome_set, "assalto", "richiamo", "hp_trigger"):
                  bersaglio = target if target in nemico else next((x for x in order if x in nemico), None)
                  if bersaglio is not None and isinstance(nemico.get(bersaglio), dict):
                      danno = proc_val(nome_set, "assalto", "richiamo", "danno")
                      nemico[bersaglio]["hp"] -= danno
                      player["fatto"] = player.get("fatto", 0) + danno
                      testo += f"🌊 Il profondo risponde: {danno} danni a {bersaglio}!\\n"
                      if nemico[bersaglio].get("hp", 0) <= 0:
                          nemico.pop(bersaglio, None)

              if nome_set == "Evocatore delle maree" and player.get("hp", 0) <= 0:
                  pct = proc_val(nome_set, "assalto", "tsunami", "percento_atk")
                  danno = round(player.get("atk", 0) * pct / 100)
                  colpite = 0
                  for struttura, dati in list(nemico.items()):
                      if struttura == "inguerra" or not isinstance(dati, dict) or dati.get("hp", 0) <= 0:
                          continue
                      dati["hp"] -= danno
                      colpite += 1
                      if dati["hp"] <= 0:
                          nemico.pop(struttura, None)
                  if colpite:
                      player["fatto"] = player.get("fatto", 0) + (danno * colpite)
                      testo += f"🌊 Cadendo, {player['Nome']} genera uno tsunami: {danno} danni a ciascuna delle {colpite} strutture rimaste!\\n"

              return prefisso + testo
          ''')

          # ---------------- __init__.py: etichetta set sotto gli oggetti ----------------
          p = "__init__.py"
          text = read(p)
          text = text.replace("Nucleo della tempesta", "Origine della tempesta")
          if "🧩 **Set:**" not in text:
              needle = '''            except:\n                pass\n            \n'''
              anchor = '''                if risultati[0] in liste.eventi:\n                    eventoz =liste. eventi[risultati[0]]\n                    t += f"\\\n**{eventoz}**"\n            except:\n                pass\n            \n'''
              if anchor in text:
                  replacement = anchor + '''            try:\n                set_oggetto = liste.set_per_oggetto(risultati[0])\n                if set_oggetto:\n                    t += "\\n🧩 **Set:** " + ", ".join(set_oggetto)\n            except:\n                pass\n            \n'''
                  text = text.replace(anchor, replacement, 1)
              else:
                  raise RuntimeError("Anchor visualizzazione set per oggetto non trovato")
          write(p, text)

          # Controlli statici mirati.
          import ast
          for file in ("liste.py", "bilanciamento.py", "frasi_set.py", "nft.py"):
              ast.parse(read(file), filename=file)

          # Controlli di presenza/consistenza sui nuovi set.
          import importlib.util
          spec = importlib.util.spec_from_file_location("liste_check", "liste.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          nuovi = [
              "Guerriero Temporale", "Dannato primordiale", "Macellatore", "Mente centrale",
              "Amletico", "Accumulatore di meraviglie", "Anima della festa", "Zanno",
              "Uditore del profondo", "Monarca della tempesta di fuoco", "Evocatore delle maree", "Mecha sciamano",
          ]
          for nome in nuovi:
              assert nome in mod.classi, nome
              assert nome in mod.Approccini, nome
              assert nome in mod.bonus, nome
              assert len(mod.classi[nome]) == 2, (nome, mod.classi[nome])
              assert len(mod.Approccini[nome]) == 3, (nome, mod.Approccini[nome])
          assert mod.bonus["Zanno"]["atk"] == 300
          assert mod.bonus["Amletico"]["hp"] == 50
          assert "Eroi di altrove" in read("liste.py")
          assert "Nucleo della tempesta" not in read("liste.py")
          PY

          python /tmp/applica.py

