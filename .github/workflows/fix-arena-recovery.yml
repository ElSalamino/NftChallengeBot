name: Fix arena recovery

on:
  push:
    branches:
      - feature/set-eroi-tempesta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Patch arena recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('__init__.py')
          text = p.read_text(encoding='utf-8')
          old = '''            except Exception as h:\n                player[username].pop("arena")\n                try:\n                    await client.delete_messages(\n                    chat_id=message.chat.id,\n                    message_ids=player[username]["arena"]["pin"]\n                )\n                except:\n                    pass\n                await message.reply(f"L'arena è stata chiusa per attività sospette\\n{h}")'''
          new = '''            except Exception as h:\n                arena_pin = player[username].get("arena", {}).get("pin")\n                player[username].pop("arena", None)\n                if arena_pin is not None:\n                    try:\n                        await client.delete_messages(\n                            chat_id=message.chat.id,\n                            message_ids=arena_pin\n                        )\n                    except Exception:\n                        pass\n                await message.reply(f"L'arena è stata chiusa per attività sospette\\n{h}")'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Blocco arena atteso 1 volta, trovato {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-arena-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __init__.py .github/workflows/fix-arena-recovery.yml
          git commit -m "Correggi recovery arena"
          git push origin HEAD:feature/set-eroi-tempesta
