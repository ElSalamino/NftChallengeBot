name: Retry Tempesta set fixes

on:
  push:
    branches:
      - "feature/set-eroi-tempesta"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Apply approved changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: found {text.count(old)} occurrences")
              return text.replace(old, new, 1)

          p = Path("liste.py")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r',"Pescatore":\[\]', ',"Pescatore":["Canna blu","Cappellino da pescatore"]', s, count=1)
          if n != 1:
              raise SystemExit("Pescatore replacement failed")
          changes = {
              '"Guerriero Temporale": ["Centro temporale", "Assetto mecha"]': '"Guerriero Temporale": ["Lama temporale", "Centro temporale"]',
              '"Dannato primordiale": ["Benda maledetta", "Il ciondolo della creazione"]': '"Dannato primordiale": ["Una bibbia inversa", "Benda maledetta"]',
              '"Macellatore": ["Armatura di carne", "Anima dispersa"]': '"Macellatore": ["Mannaia pazza", "Anima dispersa"]',
              '"Amletico": ["Origine della tempesta", "Corona maledetta"]': '"Amletico": ["Lama Mentale", "Corona maledetta"]',
              '"Zanno": ["Zanna maledetta", "Zanna del aliena"]': '"Zanno": ["Zanna del aliena", "Dente infernale"]',
              '"Monarca della tempesta di fuoco": ["Un copricapo rossastro", "Anima dispersa"]': '"Monarca della tempesta di fuoco": ["Fiamma bluastra", "Un copricapo rossastro"]',
              '"Evocatore delle maree": ["Il ciondolo della creazione", "Chela animata"]': '"Evocatore delle maree": ["Tentacolo viscido", "Il ciondolo della creazione"]',
          }
          for old, new in changes.items():
              s = one(s, old, new, old)
          s = one(
              s,
              '    "Zanna del aliena":"Eroi della tempesta ⛈"\n}',
              '    "Zanna del aliena":"Eroi della tempesta ⛈",\n    "Lama temporale":"Eroi della tempesta ⛈",\n    "Una valigia senza fine":"Eroi della tempesta ⛈",\n    "Un libro su tutte le creature":"Eroi della tempesta ⛈"\n}',
              "catalogo eventi Tempesta",
          )
          p.write_text(s, encoding="utf-8")

          p = Path("__init__.py")
          s = p.read_text(encoding="utf-8")
          s = one(
              s,
              'tempesta = ["Centro temporale LV0","Benda maledetta LV0","Armatura di carne LV0","Anima dispersa LV0","Origine della tempesta LV0","Corona maledetta LV0","Il ciondolo della creazione LV0","Zanna del aliena LV0"]',
              'tempesta = ["Centro temporale LV0","Benda maledetta LV0","Armatura di carne LV0","Anima dispersa LV0","Origine della tempesta LV0","Corona maledetta LV0","Il ciondolo della creazione LV0","Zanna del aliena LV0","Assetto mecha LV0","Lama temporale LV0","Una valigia senza fine LV0","Un libro su tutte le creature LV0"]',
              "pool Tempesta",
          )
          s = one(
              s,
              '"Zanna del aliena":"⛈"}',
              '"Zanna del aliena":"⛈","Lama temporale":"⛈","Una valigia senza fine":"⛈","Un libro su tutte le creature":"⛈"}',
              "emoji Tempesta",
          )
          old = 'random.choice(["gungeon", "zombie", "mega", "magic"])'
          if s.count(old) != 2:
              raise SystemExit(f"automatic choices: {s.count(old)}")
          s = s.replace(old, 'random.choice(["gungeon", "zombie", "mega", "magic", "tempesta"])')

          marker = '    evento["mod"] = mod\n'
          if s.count(marker) != 2:
              raise SystemExit(f"event init markers: {s.count(marker)}")
          s = s.replace(
              marker,
              marker + '    if scelto == "tempesta":\n        testo = "Gli Eroi della Tempesta ⛈ irrompono nel mondo!\\nNuovi equip e set Tempesta sono disponibili nelle ricompense!"\n',
          )

          patterns = [
              re.compile(r'(?P<i>^[ \t]*)if evento\["evento"\] == "magic":\n(?P<b>^[ \t]*)vertutto = (?P<e>[^\n]*magic[^\n]*)', re.M),
              re.compile(r'(?P<i>^[ \t]*)elif evento\.get\("evento"\) == "magic":\n(?P<b>^[ \t]*)vertutto = (?P<e>[^\n]*magic[^\n]*)', re.M),
          ]
          hits = 0
          for pattern in patterns:
              def repl(m):
                  original = m.group(0)
                  kw = "elif" if original.lstrip().startswith("elif") else "if"
                  access = '.get("evento")' if '.get("evento")' in original else '["evento"]'
                  expr = m.group("e").replace("magic", "tempesta").rstrip()
                  return original + "\n" + m.group("i") + kw + " evento" + access + ' == "tempesta":\n' + m.group("b") + "vertutto = " + expr
              s, n = pattern.subn(repl, s)
              hits += n
          if hits < 5:
              raise SystemExit(f"reward integration hits: {hits}")
          p.write_text(s, encoding="utf-8")
          print(f"Tempesta integrated in {hits} reward blocks")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile liste.py
          python - <<'PY'
          from pathlib import Path
          import liste
          wanted = {
              "Pescatore": ["Canna blu", "Cappellino da pescatore"],
              "Guerriero Temporale": ["Lama temporale", "Centro temporale"],
              "Dannato primordiale": ["Una bibbia inversa", "Benda maledetta"],
              "Macellatore": ["Mannaia pazza", "Anima dispersa"],
              "Amletico": ["Lama Mentale", "Corona maledetta"],
              "Zanno": ["Zanna del aliena", "Dente infernale"],
              "Monarca della tempesta di fuoco": ["Fiamma bluastra", "Un copricapo rossastro"],
              "Evocatore delle maree": ["Tentacolo viscido", "Il ciondolo della creazione"],
          }
          weapons = set(liste.armi) | set(liste.armiextra)
          protections = set(liste.protezioni) | set(liste.protezioniextra)
          for name, pair in wanted.items():
              assert liste.classi[name] == pair
              assert pair[0] in weapons
              assert pair[1] in protections
          src = Path("__init__.py").read_text(encoding="utf-8")
          assert src.count('scelto == "tempesta"') == 2
          assert 'random.choice(["gungeon", "zombie", "mega", "magic", "tempesta"])' in src
          assert 'Una valigia senza fine LV0' in src and 'Un libro su tutte le creature LV0' in src
          print("Validation OK")
          PY
          git diff --check
          rm -f .github/workflows/apply_tempesta_sets.yml .github/workflows/retry_tempesta_sets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sistema set e evento Eroi della Tempesta"
          git push origin feature/set-eroi-tempesta
