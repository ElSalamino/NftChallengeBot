name: Pulisce branch playtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-delete-playtest-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Elimina branch temporaneo
        run: git push origin --delete feature/single-player-playtest-v1
