name: Playtest web single player

on:
  push:
    branches:
      - main
      - feature/single-player-playtest-v1
    paths:
      - "playtest_web.py"
      - "playtest/**"
      - "requirements-playtest.txt"
      - "Avvia_Playtest.bat"
      - "Installa_Playtest.bat"
      - "liste.py"
      - "bilanciamento.py"
      - "dungeon_extra.py"
      - "nft.py"
      - "turno_assalto.py"
      - "i18n.py"
      - "i18n_web.js"
      - "locales/**"
      - "wiki/**"
      - ".github/workflows/playtest-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "playtest_web.py"
      - "playtest/**"
      - "requirements-playtest.txt"
      - "Avvia_Playtest.bat"
      - "Installa_Playtest.bat"
      - "liste.py"
      - "bilanciamento.py"
      - "dungeon_extra.py"
      - "nft.py"
      - "turno_assalto.py"
      - "i18n.py"
      - "i18n_web.js"
      - "locales/**"
      - "wiki/**"
      - ".github/workflows/playtest-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test strutturale senza dipendenze Telegram
        run: |
          python -m py_compile playtest_web.py i18n.py
          node --check i18n_web.js
          node tools/audit_i18n_web.js
          python playtest_web.py --self-test
          test -s playtest/index.html
          test -s requirements-playtest.txt
          test -s Avvia_Playtest.bat
          test -s Installa_Playtest.bat
          grep -q "NFT — Single Player Playtest" playtest/index.html
          grep -q "Podio — test rapido" playtest/index.html
          grep -q "Lancia la canna" playtest/index.html
          grep -q 'id="languageSelect"' playtest/index.html
          grep -q '/assets/i18n.js' playtest/index.html

      - name: Installa dipendenze minime del runtime
        run: python -m pip install --disable-pip-version-check -r requirements-playtest.txt

      - name: Verifica motore nft.turno dalla web app
        run: |
          python tools/audit_telegram_i18n.py
          python - <<'PY'
          import json
          import playtest_web as p

          status = p.runtime_status()
          print(status)
          assert status['exact_runtime'], status

          c = p.catalog()
          player = {
              'name': 'Playtester',
              'hp': 1000,
              'atk': 100,
              'def': 100,
              'agi': 50,
              'approach': 'Base',
          }
          state = p.start_fight({
              'player': player,
              'target_kind': 'enemy',
              'target_name': c['enemies'][0],
              'target_level': 0,
          })
          result = p.fight_round({'state': state})
          assert result['round'] == 1
          assert result['log']
          json.dumps(result, ensure_ascii=False)
          print('Round web 1:1 eseguito contro', c['enemies'][0])
          PY
