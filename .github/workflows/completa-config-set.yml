name: Completa configurazione set

on:
  push:
    branches:
      - refactor/bilanciamento-config

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilanciamento-config
          fetch-depth: 0

      - name: Completa database e sostituisci magic number
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pprint
          import re
          from pathlib import Path

          def literal_assignment(text, name):
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      return node, ast.literal_eval(node.value)
              raise RuntimeError(f'{name} non trovato')

          def deep_merge(dst, src):
              for k, v in src.items():
                  if isinstance(v, dict) and isinstance(dst.get(k), dict):
                      deep_merge(dst[k], v)
                  else:
                      dst[k] = v

          # -----------------------------------------------------------------
          # 1) Completa PROC_CLASSI: ogni set di liste.classi deve esistere.
          # -----------------------------------------------------------------
          liste_text = Path('liste.py').read_text(encoding='utf-8')
          _, classi = literal_assignment(liste_text, 'classi')

          bil_path = Path('bilanciamento.py')
          bil_text = bil_path.read_text(encoding='utf-8')
          proc_node, proc = literal_assignment(bil_text, 'PROC_CLASSI')

          special_missing = {
              "Cavaliere d'argento": {
                  "turno": {"recupero_colpo": {"mod_massimo": 0.8, "mod_bonus": 0.2}},
                  "assalto": {"danno_fisso": {"danno": 15}},
              },
              "Corvo": {
                  "turno": {"pressione_evasiva": {"dogebonus": -10}},
              },
              "Difensore del popolo": {
                  "dungeon": {"salvataggio_supporto": {
                      "hp_supporto_fallback": 100,
                      "cura_divisore": 2,
                      "hp_salvato_min": 1,
                      "hp_supporto_consumato": -1000,
                  }},
              },
              "Eroe caduto": {
                  "assalto": {"supporto_clan": {
                      "compagni_soglia": 2,
                      "serv_bonus_nft": 1,
                      "serv_bonus_bot": 2,
                  }},
              },
              "Eroe della rivolta": {
                  "assalto": {"supporto_clan": {"serv_mul": 1.2}},
              },
              "Inferno risvegliato": {
                  "turno": {"inferno": {"atk_main": 200, "atk_target": 200}},
                  "assalto": {"inferno": {"atk_bonus": 100, "atk_player": 100}},
              },
              "Lupo di mare": {
                  "ricompense": {"duello": {"punti_malus": -2}},
              },
              "Macellaio": {
                  "turno": {"difesa_sangue": {"hp_divisore": 10}},
                  "assalto": {"carne": {"hp_divisore": 20}},
              },
              "MusicoSciamano": {
                  "turno": {"specchio": {"copia_set_avversario": True}},
              },
              "Paladino": {
                  "boss": {"scudo": {"hp_scudo": 1000}},
                  "dungeon": {"scudo": {"hp_scudo": 200}},
                  "arena": {"scudo": {"hp_scudo": 800}},
                  "turno": {"scudo": {"mod_bonus": 0.5}},
              },
              "Pescatore": {
                  "pesca": {"rarita": {"bonus_rarita": 1}},
                  "dungeon": {"armeria": {"compatibile": False}},
              },
              "Pescatore di balene": {
                  "pesca": {"rarita": {"bonus_rarita": 2}},
              },
              "Pilota": {
                  "ricompense": {
                      "exp": {"bonus_probabilita_pct": 10},
                      "duello": {"punti_bonus": 2},
                  },
              },
              "Proiettile": {
                  "turno": {"difesa": {"mod_delta": -0.3}},
                  "assalto": {"difesa": {"def": 40}},
              },
              "Re dei pirati": {
                  "assalto": {"supporto_ciurma": {"danno_min": 20, "atk_divisore": 15}},
              },
              "Re del raaave": {
                  "assalto": {"meteo": {
                      "caldo_infernale_agi": -30,
                      "caldo_torrido_atk": -100,
                      "arcobaleno_atk": 100,
                  }},
              },
              "Serial killer": {
                  "generale": {"inizio": {"hp_target_percento": 75}},
                  "assalto": {"bersaglio_enorme": {"agi": 30}},
                  "dungeon": {"contro_serial": {"danno": 150}},
              },
              "Spadaccino Musashi": {
                  "turno": {"riduzione_danno": {"danno_mul": 0.7}},
                  "assalto": {"difesa": {"def_mul": 1.2}},
              },
              "Uomo di un tempo": {
                  "turno": {"vitalita": {"hp": 22}},
                  "assalto": {"vitalita": {"hp": 5}},
              },
          }

          for nome in classi:
              if nome in proc:
                  continue
              if nome in special_missing:
                  proc[nome] = special_missing[nome]
              else:
                  proc[nome] = {"generale": {"set_base": {"solo_bonus_base": True}}}

          # Effetti deterministici rimasti fuori per set già presenti.
          deterministic_updates = {
              "Sopravvissuto": {"ricompense": {"exp": {"bonus_probabilita_pct": 25}}},
              "Cacciatore della feccia": {"turno": {"difesa_sotto_soglia": {
                  "fatto_max": 300, "agi_difesa": 45, "def_difesa": 375,
              }}},
              "Guerriero 3D": {"turno": {"atterraggio": {"mod_delta": -0.55}}},
              "Spacca Mostri": {"turno": {"mostro_enorme": {"hp_divisore": 4}}},
              "Elfo silvano": {"turno": {"evasione": {"dogebonus": 40}}},
              "Juggernaut": {"turno": {"peso": {"agi_difesa_mul": 0.3}}},
              "Scudiero del boschetto": {"turno": {"recupero": {
                  "fatto_max": 300, "hp": 30, "atk": 10, "def": 10, "agi": 3,
              }}},
          }
          for nome, cfg in deterministic_updates.items():
              deep_merge(proc[nome], cfg)

          # Riscrive solo l'assegnazione PROC_CLASSI, lasciando il resto del file intatto.
          bil_lines = bil_text.splitlines(keepends=True)
          start = proc_node.lineno - 1
          end = proc_node.end_lineno
          new_assignment = 'PROC_CLASSI = ' + pprint.pformat(proc, width=140, sort_dicts=False) + '\n'
          bil_text = ''.join(bil_lines[:start]) + new_assignment + ''.join(bil_lines[end:])
          bil_path.write_text(bil_text, encoding='utf-8')

          # -----------------------------------------------------------------
          # 2) nft.py legge i valori dal database.
          # -----------------------------------------------------------------
          nft_path = Path('nft.py')
          nft = nft_path.read_text(encoding='utf-8')

          replacements = [
              ('if matx < 2 and giocatore["set"] == \'Eroe caduto\':\n                                        serv += 1',
               'if matx < proc_val("Eroe caduto", "assalto", "supporto_clan", "compagni_soglia") and giocatore["set"] == \'Eroe caduto\':\n                                        serv += proc_val("Eroe caduto", "assalto", "supporto_clan", "serv_bonus_nft")'),
              ('if giocatore["set"] == \'Eroe della rivolta\':\n                                        serv = serv * 1.2',
               'if giocatore["set"] == \'Eroe della rivolta\':\n                                        serv = serv * proc_val("Eroe della rivolta", "assalto", "supporto_clan", "serv_mul")'),
              ('if set == "Re del raaave":\n                bonus["agi"] -= 30',
               'if set == "Re del raaave":\n                bonus["agi"] += proc_val(set, "assalto", "meteo", "caldo_infernale_agi")'),
              ('if set == "Re del raaave":\n                bonus["atk"] -= 100',
               'if set == "Re del raaave":\n                bonus["atk"] += proc_val(set, "assalto", "meteo", "caldo_torrido_atk")'),
              ('if set == "Re del raaave":\n                player["atk"] += 100',
               'if set == "Re del raaave":\n                player["atk"] += proc_val(set, "assalto", "meteo", "arcobaleno_atk")'),
              ('if set == "Inferno risvegliato":\n            bonus["atk"] += 100\n            player["atk"] += 100',
               'if set == "Inferno risvegliato":\n            bonus["atk"] += proc_val(set, "assalto", "inferno", "atk_bonus")\n            player["atk"] += proc_val(set, "assalto", "inferno", "atk_player")'),
              ('if set == "Serial killer":\n                text += f"Anche se sa di aver sbagliato bersaglio {nome} è deciso ad arrivarci!"\n                player["agi"] += 30',
               'if set == "Serial killer":\n                text += f"Anche se sa di aver sbagliato bersaglio {nome} è deciso ad arrivarci!"\n                player["agi"] += proc_val(set, "assalto", "bersaglio_enorme", "agi")'),
              ('dmg = round(max(20,playerg[pl]["scheda"]["atk"]//15))',
               'dmg = round(max(proc_val("Re dei pirati", "assalto", "supporto_ciurma", "danno_min"), playerg[pl]["scheda"]["atk"] // proc_val("Re dei pirati", "assalto", "supporto_ciurma", "atk_divisore")))'),
              ('elif set == "Macellaio":\n                        defense += player["hp"] / 20',
               'elif set == "Macellaio":\n                        defense += player["hp"] / proc_val(set, "assalto", "carne", "hp_divisore")'),
              ("elif set == 'Spadaccino Musashi':\n                        defense = defense * 1.2", 
               "elif set == 'Spadaccino Musashi':\n                        defense = defense * proc_val(set, \"assalto\", \"difesa\", \"def_mul\")"),
              ('elif set == "Proiettile":\n                        defense += 40',
               'elif set == "Proiettile":\n                        defense += proc_val(set, "assalto", "difesa", "def")'),
              ('elif set == "Uomo di un tempo":\n                        player["hp"] += 5',
               'elif set == "Uomo di un tempo":\n                        player["hp"] += proc_val(set, "assalto", "vitalita", "hp")'),
              ('if set == "Cavaliere d\'argento":\n                            dannissimi += 15',
               'if set == "Cavaliere d\'argento":\n                            dannissimi += proc_val(set, "assalto", "danno_fisso", "danno")'),
              ('elif set == "Inferno risvegliato":\n            main["atk"] += 200\n            oppo["atk"] += 200',
               'elif set == "Inferno risvegliato":\n            main["atk"] += proc_val(set, "turno", "inferno", "atk_main")\n            oppo["atk"] += proc_val(set, "turno", "inferno", "atk_target")'),
              ('elif set == "Uomo di un tempo":\n            main["hp"] += 22',
               'elif set == "Uomo di un tempo":\n            main["hp"] += proc_val(set, "turno", "vitalita", "hp")'),
              ('elif set == "Corvo":\n            dogebonus -= 10',
               'elif set == "Corvo":\n            dogebonus += proc_val(set, "turno", "pressione_evasiva", "dogebonus")'),
              ('elif set == "Scudiero del boschett" and main["fatto"] <= 300:\n            main["hp"] += 30\n            main["atk"] += 10\n            main["def"] += 10\n            main["agi"] += 3',
               'elif set == "Scudiero del boschetto" and main["fatto"] <= proc_val("Scudiero del boschetto", "turno", "recupero", "fatto_max"):\n            main["hp"] += proc_val("Scudiero del boschetto", "turno", "recupero", "hp")\n            main["atk"] += proc_val("Scudiero del boschetto", "turno", "recupero", "atk")\n            main["def"] += proc_val("Scudiero del boschetto", "turno", "recupero", "def")\n            main["agi"] += proc_val("Scudiero del boschetto", "turno", "recupero", "agi")'),
              ('elif setN == "Cacciatore della feccia" and  oppo["fatto"] <= 300:\n            agin += 45\n            difesan += 375',
               'elif setN == "Cacciatore della feccia" and oppo["fatto"] <= proc_val(setN, "turno", "difesa_sotto_soglia", "fatto_max"):\n            agin += proc_val(setN, "turno", "difesa_sotto_soglia", "agi_difesa")\n            difesan += proc_val(setN, "turno", "difesa_sotto_soglia", "def_difesa")'),
              ('elif setN == "Elfo silvano":\n            dogebonus += 40',
               'elif setN == "Elfo silvano":\n            dogebonus += proc_val(setN, "turno", "evasione", "dogebonus")'),
              ('if set == "Cavaliere d\'argento" and mod <= 0.8:\n            mod += 0.2',
               'if set == "Cavaliere d\'argento" and mod <= proc_val(set, "turno", "recupero_colpo", "mod_massimo"):\n            mod += proc_val(set, "turno", "recupero_colpo", "mod_bonus")'),
              ('elif set == "Spacca Mostri":\n            dps += oppo["hp"] / 4',
               'elif set == "Spacca Mostri":\n            dps += oppo["hp"] / proc_val(set, "turno", "mostro_enorme", "hp_divisore")'),
              ('if setN == "Proiettile":\n            mod -= 0.3',
               'if setN == "Proiettile":\n            mod += proc_val(setN, "turno", "difesa", "mod_delta")'),
              ('elif setN == "Macellaio":\n            difesan += oppo["hp"] // 10',
               'elif setN == "Macellaio":\n            difesan += oppo["hp"] // proc_val(setN, "turno", "difesa_sangue", "hp_divisore")'),
              ('if setN == "Guerriero 3D":\n                mod -= 0.55',
               'if setN == "Guerriero 3D":\n                mod += proc_val(setN, "turno", "atterraggio", "mod_delta")'),
              ("if setN == 'Spadaccino Musashi':\n                danno = danno * .7",
               "if setN == 'Spadaccino Musashi':\n                danno = danno * proc_val(setN, \"turno\", \"riduzione_danno\", \"danno_mul\")"),
              ('elif "Forma" in seet or "Pescatore" == seet:',
               'elif "Forma" in seet or ("Pescatore" == seet and not proc_val("Pescatore", "dungeon", "armeria", "compatibile")):'),
          ]

          for old, new in replacements:
              if old not in nft:
                  raise RuntimeError('Pattern nft.py non trovato:\n' + old)
              nft = nft.replace(old, new)

          # Paladino: i tre valori iniziali sono contestuali ma ripetuti più volte.
          nft = nft.replace('["Scudo"] = 1000', '["Scudo"] = proc_val("Paladino", "boss", "scudo", "hp_scudo")')
          nft = nft.replace('["Scudo"] = 800', '["Scudo"] = proc_val("Paladino", "arena", "scudo", "hp_scudo")')
          nft = nft.replace('["Scudo"] = 200', '["Scudo"] = proc_val("Paladino", "dungeon", "scudo", "hp_scudo")')

          # Serial killer: 75% HP in tutti i contesti che già usavano 0.75.
          nft = re.sub(
              r'round\((user[12]\["hp"\]) \* 0\.75\)',
              r'round(\1 * (proc_val("Serial killer", "generale", "inizio", "hp_target_percento") / 100))',
              nft,
          )
          nft = nft.replace('user1["hp"] -= 150', 'user1["hp"] -= proc_val("Serial killer", "dungeon", "contro_serial", "danno")')
          nft = nft.replace('(mod +0.5)', '(mod + proc_val(setN, "turno", "scudo", "mod_bonus"))')

          # Guardiano del passaggio: valore già presente nel database.
          nft = nft.replace('player["hp"] = 1000', 'player["hp"] = proc_val(set, "assalto", "resurrezione", "hp")')

          nft_path.write_text(nft, encoding='utf-8')

          # -----------------------------------------------------------------
          # 3) __init__.py usa nft.proc_val sugli stessi database.
          # -----------------------------------------------------------------
          init_path = Path('__init__.py')
          init = init_path.read_text(encoding='utf-8')

          init = init.replace('possibilia += 0.1', 'possibilia += nft.proc_val("Pilota", "ricompense", "exp", "bonus_probabilita_pct") / 100')
          init = init.replace('possibilib += 0.1', 'possibilib += nft.proc_val("Pilota", "ricompense", "exp", "bonus_probabilita_pct") / 100')
          init = init.replace('possibilia += 0.25', 'possibilia += nft.proc_val("Sopravvissuto", "ricompense", "exp", "bonus_probabilita_pct") / 100')

          init = init.replace('if a["scheda"]["set"] == "Pilota":\n                                    punti += 2',
                              'if a["scheda"]["set"] == "Pilota":\n                                    punti += nft.proc_val("Pilota", "ricompense", "duello", "punti_bonus")')
          init = init.replace('if b["scheda"]["set"] == "Lupo di mare":\n                                    punti -= 2',
                              'if b["scheda"]["set"] == "Lupo di mare":\n                                    punti += nft.proc_val("Lupo di mare", "ricompense", "duello", "punti_malus")')

          # Bonus rarità pesca: sostituisce tutte le copie della stessa logica.
          init = re.sub(
              r'(\s*)if scheda\["set"\] == "Pescatore":\n\1    fs_w \+= 1',
              lambda m: m.group(1) + 'if scheda["set"] == "Pescatore":\n' + m.group(1) + '    fs_w += nft.proc_val("Pescatore", "pesca", "rarita", "bonus_rarita")',
              init,
          )
          init = re.sub(
              r'(\s*)if scheda\["set"\] == "Pescatore di balene":\n\1    fs_w \+= 2',
              lambda m: m.group(1) + 'if scheda["set"] == "Pescatore di balene":\n' + m.group(1) + '    fs_w += nft.proc_val("Pescatore di balene", "pesca", "rarita", "bonus_rarita")',
              init,
          )

          # Anche il percorso speciale di equip Pescatore usa la descrizione centralizzata.
          init = init.replace('t += "Set del Pescatore equipaggiato!\\nStats extra e pesca migliorata!"',
                              't += liste.frasi_set["Pescatore"]')

          # Eroi: preserva volutamente +2 nel bot e +1 nel percorso nft.py.
          init = init.replace('if matx < 2 and giocatore["set"] == \'Eroe caduto\':\n                                            serv += 2',
                              'if matx < nft.proc_val("Eroe caduto", "assalto", "supporto_clan", "compagni_soglia") and giocatore["set"] == \'Eroe caduto\':\n                                            serv += nft.proc_val("Eroe caduto", "assalto", "supporto_clan", "serv_bonus_bot")')
          init = init.replace('if giocatore["set"] == \'Eroe della rivolta\':\n                                            serv = serv * 1.2',
                              'if giocatore["set"] == \'Eroe della rivolta\':\n                                            serv = serv * nft.proc_val("Eroe della rivolta", "assalto", "supporto_clan", "serv_mul")')

          # Paladino e Serial killer nei percorsi gestiti direttamente da __init__.py.
          init = init.replace('["Scudo"] = 1000', '["Scudo"] = nft.proc_val("Paladino", "boss", "scudo", "hp_scudo")')
          init = init.replace('["Scudo"] = 800', '["Scudo"] = nft.proc_val("Paladino", "arena", "scudo", "hp_scudo")')
          init = init.replace('["Scudo"] = 200', '["Scudo"] = nft.proc_val("Paladino", "dungeon", "scudo", "hp_scudo")')
          init = re.sub(
              r'round\((user[12]\["hp"\]) \* 0\.75\)',
              r'round(\1 * (nft.proc_val("Serial killer", "generale", "inizio", "hp_target_percento") / 100))',
              init,
          )
          init = init.replace('user1["hp"] -= 150', 'user1["hp"] -= nft.proc_val("Serial killer", "dungeon", "contro_serial", "danno")')

          init_path.write_text(init, encoding='utf-8')

          # -----------------------------------------------------------------
          # 4) Verifiche strutturali.
          # -----------------------------------------------------------------
          # Ricarica i literal dopo la riscrittura.
          _, new_proc = literal_assignment(bil_path.read_text(encoding='utf-8'), 'PROC_CLASSI')
          missing = set(classi) - set(new_proc)
          if missing:
              raise RuntimeError(f'Set ancora senza config: {sorted(missing)}')
          if len(new_proc) != len(classi):
              raise RuntimeError(f'PROC_CLASSI={len(new_proc)} ma classi={len(classi)}')

          nft_check = nft_path.read_text(encoding='utf-8')
          for forbidden in [
              'set == "Scudiero del boschett"',
              'set == "Cavaliere d\'argento" and mod <= 0.8',
              'setN == "Proiettile":\n            mod -= 0.3',
              'elif setN == "Macellaio":\n            difesan += oppo["hp"] // 10',
              "if setN == 'Spadaccino Musashi':\n                danno = danno * .7",
          ]:
              if forbidden in nft_check:
                  raise RuntimeError('Hardcode ancora presente: ' + forbidden)
          PY

          python -m py_compile nft.py bilanciamento.py

      - name: Commit finale e pulizia report temporanei
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f audit_set_completo.txt audit_set_globale.txt audit_hardcode_set.txt set_mancanti_scan.txt set_main_scan.txt
          git add -A -- nft.py __init__.py bilanciamento.py audit_set_completo.txt audit_set_globale.txt audit_hardcode_set.txt set_mancanti_scan.txt set_main_scan.txt .github/workflows/completa-config-set.yml
          git rm --ignore-unmatch .github/workflows/completa-config-set.yml
          git commit -m "refactor: completa configurazione di tutti i set"
          git push origin HEAD:refactor/bilanciamento-config
