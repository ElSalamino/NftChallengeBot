name: Recover Daniele challenge fallback

on:
  push:
    branches:
      - feature/set-eroi-tempesta

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Apply corrected Daniele patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/sfide-daniele.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          old_check = "compile(helper.replace('          ', '', 1) if False else helper, '<daniele-helper>', 'exec')"
          new_check = "compile(helper[:helper.rfind('pescaTORI = list()')], '<daniele-helper>', 'exec')"
          if old_check not in script:
              raise SystemExit('helper validation marker not found')
          script = script.replace(old_check, new_check, 1)
          exec(compile(script, '<apply-daniele-patch>', 'exec'), {})
          PY

          git diff --check

      - name: Verify generated Daniele code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('__init__.py').read_text(encoding='utf-8')

          required = [
              'SFIDA_BOT_NAME = "Daniele"',
              'SFIDA_BOT_COSTI_STAT = {"hp": 1, "atk": 4, "def": 4, "agi": 20}',
              'cap_speso = max(0, int(utente.get("cap", 0) or 0))',
              '_daniele_livello_item(scheda_utente.get("arma"))',
              '_daniele_livello_item(scheda_utente.get("protezione"))',
              'random.choice(list(liste.anelli))',
              'bot["Ap"] = random.choice(approcci)',
              'and not player[nome].get("preso", False)',
              'sfidante = _trova_sfidante_reale(username)',
              'if sfidha.get("bot", False):',
              '_risolvi_sfida_daniele(sfidha)',
              '"bot": True,',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing expected token: {token}')

          helper_start = text.index('SFIDA_BOT_NAME = "Daniele"')
          helper_end = text.index('pescaTORI = list()', helper_start)
          compile(text[helper_start:helper_end], '<daniele-helper>', 'exec')

          sfida_start = text.index('async def sfida(client, message):', text.index('filters.regex(r"^Sfida ⚔️")'))
          sfida_end = text.index('@app.on_message(filters.regex(r"^Pesca 🎣")', sfida_start)
          sfida_block = text[sfida_start:sfida_end]
          if 'sfidante = nft.match(sort_orders, message.from_user.username)' in sfida_block:
              raise SystemExit('legacy private matcher still present')
          if 'if not sfidante_bot and sfidante in list(inabilitati):' not in sfida_block:
              raise SystemExit('bot/human availability guard missing')
          PY

      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sfide-daniele.yml .github/workflows/sfide-daniele-recover.yml
          git add __init__.py .github/workflows/sfide-daniele.yml .github/workflows/sfide-daniele-recover.yml
          git commit -m "Aggiunge Daniele come fallback delle sfide"
          git push origin feature/set-eroi-tempesta
