name: Apply Tempesta set fixes

on:
  push:
    branches:
      - "feature/set-eroi-tempesta"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/set-eroi-tempesta
          fetch-depth: 0

      - name: Apply approved set and Tempesta changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          liste_path = Path("liste.py")
          liste = liste_path.read_text(encoding="utf-8")

          liste, n = re.subn(r',"Pescatore":\[\]', ',"Pescatore":["Canna blu","Cappellino da pescatore"]', liste, count=1)
          if n != 1:
              raise SystemExit(f"Pescatore: expected 1 replacement, found {n}")

          set_changes = {
              '"Guerriero Temporale": ["Centro temporale", "Assetto mecha"]': '"Guerriero Temporale": ["Lama temporale", "Centro temporale"]',
              '"Dannato primordiale": ["Benda maledetta", "Il ciondolo della creazione"]': '"Dannato primordiale": ["Una bibbia inversa", "Benda maledetta"]',
              '"Macellatore": ["Armatura di carne", "Anima dispersa"]': '"Macellatore": ["Mannaia pazza", "Anima dispersa"]',
              '"Amletico": ["Origine della tempesta", "Corona maledetta"]': '"Amletico": ["Lama Mentale", "Corona maledetta"]',
              '"Zanno": ["Zanna maledetta", "Zanna del aliena"]': '"Zanno": ["Zanna del aliena", "Dente infernale"]',
              '"Monarca della tempesta di fuoco": ["Un copricapo rossastro", "Anima dispersa"]': '"Monarca della tempesta di fuoco": ["Fiamma bluastra", "Un copricapo rossastro"]',
              '"Evocatore delle maree": ["Il ciondolo della creazione", "Chela animata"]': '"Evocatore delle maree": ["Tentacolo viscido", "Il ciondolo della creazione"]',
          }
          for old, new in set_changes.items():
              liste = replace_once(liste, old, new, old)

          eventi_marker = '    "Zanna del aliena":"Eroi della tempesta ⛈"\n}'
          eventi_repl = (
              '    "Zanna del aliena":"Eroi della tempesta ⛈",\n'
              '    "Lama temporale":"Eroi della tempesta ⛈",\n'
              '    "Una valigia senza fine":"Eroi della tempesta ⛈",\n'
              '    "Un libro su tutte le creature":"Eroi della tempesta ⛈"\n'
              '}'
          )
          liste = replace_once(liste, eventi_marker, eventi_repl, "eventi Tempesta")
          liste_path.write_text(liste, encoding="utf-8")

          init_path = Path("__init__.py")
          init = init_path.read_text(encoding="utf-8")

          old_tempesta = 'tempesta = ["Centro temporale LV0","Benda maledetta LV0","Armatura di carne LV0","Anima dispersa LV0","Origine della tempesta LV0","Corona maledetta LV0","Il ciondolo della creazione LV0","Zanna del aliena LV0"]'
          new_tempesta = 'tempesta = ["Centro temporale LV0","Benda maledetta LV0","Armatura di carne LV0","Anima dispersa LV0","Origine della tempesta LV0","Corona maledetta LV0","Il ciondolo della creazione LV0","Zanna del aliena LV0","Assetto mecha LV0","Lama temporale LV0","Una valigia senza fine LV0","Un libro su tutte le creature LV0"]'
          init = replace_once(init, old_tempesta, new_tempesta, "pool Tempesta")

          emoji_marker = '"Zanna del aliena":"⛈"}'
          emoji_repl = '"Zanna del aliena":"⛈","Lama temporale":"⛈","Una valigia senza fine":"⛈","Un libro su tutte le creature":"⛈"}'
          init = replace_once(init, emoji_marker, emoji_repl, "emoji Tempesta")

          old_choices = 'random.choice(["gungeon", "zombie", "mega", "magic"])'
          choice_count = init.count(old_choices)
          if choice_count != 2:
              raise SystemExit(f"automatic event choices: expected 2 occurrences, found {choice_count}")
          init = init.replace(old_choices, 'random.choice(["gungeon", "zombie", "mega", "magic", "tempesta"])')

          mod_marker = '    evento["mod"] = mod\n'
          mod_count = init.count(mod_marker)
          if mod_count != 2:
              raise SystemExit(f"event mod marker: expected 2 occurrences, found {mod_count}")
          tempesta_text = (
              mod_marker
              + '    if scelto == "tempesta":\n'
              + '        testo = "Gli Eroi della Tempesta ⛈ irrompono nel mondo!\\nNuovi equip e set Tempesta sono disponibili nelle ricompense!"\n'
          )
          init = init.replace(mod_marker, tempesta_text)

          reward_patterns = [
              re.compile(r'(?P<indent>^[ \t]*)if evento\["evento"\] == "magic":\n(?P<bodyindent>^[ \t]*)vertutto = (?P<expr>[^\n]*magic[^\n]*)', re.M),
              re.compile(r'(?P<indent>^[ \t]*)elif evento\.get\("evento"\) == "magic":\n(?P<bodyindent>^[ \t]*)vertutto = (?P<expr>[^\n]*magic[^\n]*)', re.M),
          ]
          total_hits = 0
          for pattern in reward_patterns:
              def add_tempesta(match):
                  nonlocal_hits[0] += 1
                  original = match.group(0)
                  kw = "elif" if original.lstrip().startswith("elif") else "if"
                  temp_expr = match.group("expr").replace("magic", "tempesta")
                  return (
                      original
                      + "\n"
                      + match.group("indent") + kw + ' evento'
                      + ('.get("evento")' if '.get("evento")' in original else '["evento"]')
                      + ' == "tempesta":\n'
                      + match.group("bodyindent") + 'vertutto = ' + temp_expr
                  )

              nonlocal_hits = [0]
              init = pattern.sub(add_tempesta, init)
              total_hits += nonlocal_hits[0]

          if total_hits < 5:
              raise SystemExit(f"Tempesta reward integration: expected at least 5 magic reward blocks, found {total_hits}")

          init_path.write_text(init, encoding="utf-8")
          print(f"Integrated Tempesta into {total_hits} reward blocks")
          PY

      - name: Validate changes
        shell: bash
        run: |
          python -m py_compile liste.py
          python - <<'PY'
          import ast
          from pathlib import Path
          import liste

          wanted = {
              "Pescatore": ["Canna blu", "Cappellino da pescatore"],
              "Guerriero Temporale": ["Lama temporale", "Centro temporale"],
              "Dannato primordiale": ["Una bibbia inversa", "Benda maledetta"],
              "Macellatore": ["Mannaia pazza", "Anima dispersa"],
              "Amletico": ["Lama Mentale", "Corona maledetta"],
              "Zanno": ["Zanna del aliena", "Dente infernale"],
              "Monarca della tempesta di fuoco": ["Fiamma bluastra", "Un copricapo rossastro"],
              "Evocatore delle maree": ["Tentacolo viscido", "Il ciondolo della creazione"],
          }
          all_armi = set(liste.armi) | set(liste.armiextra)
          all_prot = set(liste.protezioni) | set(liste.protezioniextra)
          for nome, combo in wanted.items():
              assert liste.classi[nome] == combo, (nome, liste.classi[nome])
              assert combo[0] in all_armi, (nome, combo[0], "not weapon")
              assert combo[1] in all_prot, (nome, combo[1], "not protection")

          init = Path("__init__.py").read_text(encoding="utf-8")
          for item in [
              "Assetto mecha LV0",
              "Lama temporale LV0",
              "Una valigia senza fine LV0",
              "Un libro su tutte le creature LV0",
          ]:
              assert item in init
          assert 'random.choice(["gungeon", "zombie", "mega", "magic", "tempesta"])' in init
          assert 'evento["evento"] == "tempesta"' in init or 'evento.get("evento") == "tempesta"' in init
          assert init.count('scelto == "tempesta"') == 2
          print("Validated approved set combinations and Tempesta event integration")
          PY
          git diff --check

      - name: Commit final changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply_tempesta_sets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sistema set e evento Eroi della Tempesta"
          git push origin feature/set-eroi-tempesta
