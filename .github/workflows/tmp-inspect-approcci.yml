name: Ispeziona approcci

on:
  push:
    branches:
      - feature/wiki-raw-score-v12
    paths:
      - ".github/workflows/tmp-inspect-approcci.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiki-raw-score-v12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import liste
          print('Aggressivo =', liste.Approcci['Aggressivo'])
          print('Spavaldo =', liste.Approcci['Spavaldo'])
          print('Aggressivo+ =', liste.Approcci.get('Aggressivo+'))
          PY
