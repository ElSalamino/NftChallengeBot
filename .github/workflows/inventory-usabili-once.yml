name: Inventario usabili una tantum

on:
  push:
    branches:
      - feature/wiki-assalto-usabili
    paths:
      - ".github/workflows/inventory-usabili-once.yml"

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiki-assalto-usabili
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Elenca usabili e occorrenze runtime
        run: |
          python - <<'PY'
          import json
          import liste
          from pathlib import Path

          print("=== USABILI ===")
          print(json.dumps(liste.usabili, ensure_ascii=False, indent=2))

          files = ["nft.py", "turno_assalto.py", "__init__.py", "bilanciamento.py", "liste.py"]
          print("\n=== OCCORRENZE ===")
          for name in liste.usabili:
              print(f"\n## {name}")
              found = False
              for filename in files:
                  p = Path(filename)
                  if not p.exists():
                      continue
                  lines = p.read_text(encoding="utf-8").splitlines()
                  for i, line in enumerate(lines):
                      if name in line and not (filename == "liste.py" and "usabili" in ''.join(lines[max(0,i-3):i+1])):
                          found = True
                          lo=max(0,i-3); hi=min(len(lines),i+4)
                          print(f"-- {filename}:{i+1}")
                          for j in range(lo,hi):
                              print(f"{j+1}: {lines[j]}")
              if not found:
                  print("-- nessuna occorrenza runtime trovata")
          PY
