name: Retry patch Coda e Settimanale

on:
  push:
    branches:
      - fix/coda-int-settimanale-oro
    paths:
      - ".github/workflows/tmp-coda-settimanale-retry.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ramo
        uses: actions/checkout@v4
        with:
          ref: fix/coda-int-settimanale-oro
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Applica patch
        run: python tools/tmp_patch_coda_settimanale.py

      - name: Test logica e Wiki
        run: |
          python -m py_compile nft.py turno_assalto.py settimanale.py frasi_anelli.py wiki/genera_wiki_v2.py wiki/genera_wiki_v3.py wiki/genera_wiki_v4.py wiki/genera_wiki_v5.py wiki/genera_wiki_v6.py wiki/genera_wiki_v7.py wiki/run_wiki.py wiki/validate_wiki.py wiki/validate_wiki_v4.py
          python - <<'PY'
          from pathlib import Path
          import random
          import settimanale

          nft = Path("nft.py").read_text(encoding="utf-8")
          assalto = Path("turno_assalto.py").read_text(encoding="utf-8")
          frasi = Path("frasi_anelli.py").read_text(encoding="utf-8")

          assert nft.count("estrai_premio_oro_settimanale(premi)") == 3
          assert "random.choice(premi)" not in nft
          assert all(f"SOGLIE_PREMI_ORO_SETTIMANALE[{i}]" in nft for i in range(3))
          assert 'main["lastD"] * bonusn' in assalto
          assert 'main["lastD"] * bonus) / anello_val(anellon, "turno", "dolore"' not in assalto
          assert "La probabilità cresce anche con la tua INT" in frasi

          rng = random.Random(98765)
          seen_levels = set()
          for _ in range(1000):
              premio = settimanale.estrai_premio_oro_settimanale(rng=rng)
              if " LV" in premio:
                  lv = int(premio.rsplit(" LV", 1)[1])
                  assert 0 <= lv <= 4
                  seen_levels.add(lv)
          assert seen_levels == {0, 1, 2, 3, 4}, seen_levels
          print("Coda INT e premi Settimanale LV0-LV4: OK")
          PY
          python wiki/validate_wiki_v4.py
          rm -rf _site
          python wiki/run_wiki.py --output _site
          grep -q "Premio della Settimanale" _site/index.html
          grep -q "LV0 e LV4" _site/index.html
          grep -q "Coda demoniaca lascia al nemico il ricordo del dolore" _site/index.html

      - name: Commit patch e pulizia temporanei
        run: |
          rm -f .github/workflows/tmp-coda-settimanale.yml
          rm -f .github/workflows/tmp-coda-settimanale-retry.yml
          rm -f tools/tmp_patch_coda_settimanale.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregge Coda INT e premi oro settimanali"
          git push origin HEAD:fix/coda-int-settimanale-oro
